<script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "index.html"}, {"@type": "ListItem", "position": 2, "name": "Procedures"}, {"@type": "ListItem", "position": 3, "name": "Skin"}, {"@type": "ListItem", "position": 4, "name": "Aesthetic"}, {"@type": "ListItem", "position": 5, "name": "Laser Skin Resurfacing"}]}, {"@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is laser skin resurfacing?", "acceptedAnswer": {"@type": "Answer", "text": "Laser skin resurfacing is an advanced treatment that removes damaged skin layers and stimulates collagen to improve texture, tone, and elasticity."}}, {"@type": "Question", "name": "What concerns does laser resurfacing treat?", "acceptedAnswer": {"@type": "Answer", "text": "It helps reduce fine lines, wrinkles, acne scars, pigmentation, enlarged pores, and sun damage, revealing smoother, youthful skin."}}, {"@type": "Question", "name": "What types of laser resurfacing are available?", "acceptedAnswer": {"@type": "Answer", "text": "There are two main types: ablative lasers (remove outer skin layers for dramatic results) and non-ablative lasers (work beneath the skin with little downtime)."}}, {"@type": "Question", "name": "How long is the recovery after laser resurfacing?", "acceptedAnswer": {"@type": "Answer", "text": "Recovery depends on the type of laser. Ablative lasers may require 1–2 weeks, while non-ablative treatments involve minimal downtime."}}, {"@type": "Question", "name": "How many sessions will I need?", "acceptedAnswer": {"@type": "Answer", "text": "Many patients see results after one session, but multiple treatments may be recommended for deeper concerns and optimal results."}}]}]}</script>

<script src="https://cdn.tailwindcss.com/3.4.5"></script>
<script>
  /* تغییر فونت (font change): Fraunces for headings, Manrope for paragraphs, Helvetica Neue / Inter for UI
     (menu, buttons, labels, form fields). Set FONT_CHANGE to false to go back to Aeonik + Inter + Montserrat. */
  const FONT_CHANGE = true;
  document.documentElement.classList.toggle('font-change', FONT_CHANGE);
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: FONT_CHANGE ? {
          aeonik: ['Fraunces', 'Georgia', '"Times New Roman"', 'serif'],
          inter: ['Manrope', '"Helvetica Neue"', 'Arial', 'sans-serif'],
          mont: ['"Helvetica Neue"', 'Inter', 'Arial', 'sans-serif'],
        } : {
          aeonik: ['Aeonik', 'Inter', 'system-ui', 'sans-serif'],
          inter: ['Inter', 'system-ui', 'sans-serif'],
          mont: ['Montserrat', 'system-ui', 'sans-serif'],
        },
        colors: {
          ndm: {
            blue: '#209ED9', sky: '#26B1E7', deep: '#0F80C3',
            amber: '#FFA617', red: '#EA364B',
            ink: '#1B242B', slate: '#24303A', muted: '#5A646C', soft: '#B6B6B6',
            line: '#E2E4E6', mist: '#F2F2EF', paper: '#FAFAF8', night: '#0B0F13',
          },
        },
        keyframes: {
          marquee: { '0%': { transform: 'translate3d(0,0,0)' }, '100%': { transform: 'translate3d(-50%,0,0)' } },
        },
        animation: { marquee: 'marquee 48s linear infinite' },
      },
    },
  };
</script>

<style>
  :root{
    --e-inout:cubic-bezier(.87,0,.13,1);
    --e-out:cubic-bezier(.16,1,.3,1);
    --e-quart:cubic-bezier(.165,.84,.44,1);
    --gx:clamp(20px, 5vw, 96px);
    --pad:var(--gx);
    --hpad:var(--gx);
  }
  html,body{-webkit-text-size-adjust:100%;overflow-x:clip}
  html.lenis, html.lenis body{height:auto}
  .lenis.lenis-smooth{scroll-behavior:auto !important}
  .lenis.lenis-stopped{overflow:hidden}
  body{margin:0;background:#0B0F13;color:#1B242B;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
  #root{background:#FAFAF8}
  :focus-visible{outline:2px solid #26B1E7;outline-offset:3px;border-radius:6px}
  .no-scrollbar{scrollbar-width:none}.no-scrollbar::-webkit-scrollbar{display:none}

  /* hero */
  .slide{visibility:hidden}
  .slide.is-on{visibility:visible}
  .line{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
  .is-intro .line{overflow:visible}
  .is-pre .line-in,.is-pre .fade,.is-pre .ui-fade{opacity:0}
  .is-pre .plate{clip-path:inset(100% 0 0 0)}
  .plate{position:absolute;inset:0;overflow:hidden;will-change:transform,clip-path}
  .plate .px{position:absolute;inset:-3%;transform:translate3d(calc(var(--mx,0) * -16px),calc(var(--my,0) * -10px),0);transition:transform .9s var(--e-out)}
  .plate img{width:100%;height:100%;object-fit:cover}
  .shade-x{background:linear-gradient(90deg,rgba(6,10,14,.78) 0%,rgba(6,10,14,.45) 42%,rgba(6,10,14,.12) 100%)}
  .shade-y{background:linear-gradient(0deg,rgba(6,10,14,.7) 0%,rgba(6,10,14,0) 46%),linear-gradient(180deg,rgba(6,10,14,.6) 0%,rgba(6,10,14,0) 24%)}
  .soft-blur{backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    -webkit-mask-image:radial-gradient(115% 95% at 72% 28%,transparent 46%,#000 86%);
            mask-image:radial-gradient(115% 95% at 72% 28%,transparent 46%,#000 86%)}

  /* header */
  .hdr-bar{transition:max-width .7s var(--e-out),padding .7s var(--e-out),background-color .5s ease,box-shadow .5s ease,border-radius .7s var(--e-out),border-color .5s ease,margin .7s var(--e-out),color .4s ease}
  .panel{transition:clip-path .5s var(--e-out),opacity .25s ease,visibility 0s linear .5s}
  .panel[data-open="false"]{opacity:0;clip-path:inset(0 0 100% 0 round 28px);visibility:hidden;pointer-events:none}
  .panel[data-open="true"]{opacity:1;clip-path:inset(0 0 0 0 round 28px);visibility:visible;transition:clip-path .55s var(--e-out),opacity .2s ease,visibility 0s}
  .panel>div{transition:opacity .4s ease .1s,transform .55s var(--e-out) .1s}
  .panel[data-open="false"]>div{opacity:0;transform:translateY(12px)}
  .menu-scrim{transition:opacity .45s ease,visibility 0s linear .45s}
  .menu-scrim[data-open="true"]{transition:opacity .45s ease,visibility 0s}
  /* buttons. Book Free Consultation (.btn-book) is the one signature button: amber pill, white arrow dot,
     a deep-blue fill grows out of the dot on hover. It looks identical everywhere, header included.
     Every other button is a plain pill with no icon: ink (dark), line (outline), light (on photos), glass (on dark panels). */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:1px solid transparent;
    font:500 15.5px/1.25 Inter,system-ui,sans-serif;letter-spacing:-.01em;white-space:nowrap;-webkit-tap-highlight-color:transparent;
    transition:background-color .3s ease,color .3s ease,border-color .3s ease,transform .2s ease}
  .btn:active{transform:scale(.98)}
  .btn>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;padding-block:.12em}
  .btn-sm{height:40px;padding:0 18px;font-size:14.5px}
  .btn-block{display:flex;width:100%}
  .btn-ink{background:#0F80C3;color:#fff}
  .btn-ink:hover,.btn-ink:focus-visible,.group:hover .btn-g.btn-ink{background:#0A4F7A}
  .btn-line{background:transparent;color:#1B242B;border-color:rgba(27,36,43,.18)}
  .btn-line:hover,.btn-line:focus-visible,.group:hover .btn-g.btn-line{background:#1B242B;border-color:#1B242B;color:#fff}
  .btn-light{background:#fff;color:#1B242B}
  .btn-light:hover,.btn-light:focus-visible,.group:hover .btn-g.btn-light{background:#0F80C3;border-color:#0F80C3;color:#fff;box-shadow:0 16px 34px -12px rgba(15,128,195,.75)}
  .btn-glass{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .btn-glass:hover,.btn-glass:focus-visible{background:#fff;border-color:#fff;color:#1B242B}
  .btn-book{position:relative;isolation:isolate;overflow:hidden;justify-content:space-between;gap:12px;padding:0 6px 0 22px;background:#0F80C3;color:#fff;
    border-color:#0F80C3;box-shadow:0 12px 28px -16px rgba(15,128,195,.65);transition:border-color .45s ease,box-shadow .5s ease,transform .2s ease}
  .btn-book:hover,.btn-book:focus-visible,.group:hover .btn-g.btn-book{border-color:#26B1E7;box-shadow:0 16px 34px -12px rgba(15,128,195,.65)}
  .btn-hot{background:#FFA617;border-color:#FFA617;box-shadow:0 12px 28px -12px rgba(255,166,23,.9)}
  .btn-hot .btn-dot{color:#FFA617}
  .btn-on-dark{background:#fff;color:#1B242B;border-color:#fff;box-shadow:0 12px 28px -16px rgba(0,0,0,.5)}
  .btn-on-dark .btn-dot{background:#0F80C3;color:#fff}
  .btn-on-dark:hover,.btn-on-dark:focus-visible,.group:hover .btn-g.btn-on-dark{color:#fff}
  .btn-book::before{content:"";position:absolute;z-index:-1;right:6px;top:50%;width:36px;height:36px;border-radius:999px;background:#0A4F7A;transform:translateY(-50%) scale(0);transition:transform .6s var(--e-out)}
  .btn-book:hover::before,.btn-book:focus-visible::before,.group:hover .btn-g.btn-book::before{transform:translateY(-50%) scale(22)}
  .btn-dot{display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;border-radius:999px;background:#fff;color:#1B242B;transition:transform .5s var(--e-out),color .4s ease,background-color .4s ease}
  .btn-book:hover .btn-dot,.btn-book:focus-visible .btn-dot,.group:hover .btn-g .btn-dot{transform:rotate(-45deg);color:#fff;background:rgba(255,255,255,.2)}

  /* appear on scroll */
  .rv{opacity:0;transform:translate3d(0,28px,0);filter:blur(8px);transition:opacity .9s var(--e-out),transform 1.1s var(--e-out),filter .9s var(--e-out)}
  .rv.in{opacity:1;transform:none;filter:none}

  .price-swap{animation:priceIn .55s var(--e-out) both}

/* time left until a campaign moment; null once it has passed, so countdowns hide themselves */
function useCountdown(until) {
  const [now, setNow] = useState(() => Date.now());
  useEffect(() => { if (!until) return; const t = setInterval(() => setNow(Date.now()), 20000); return () => clearInterval(t); }, [until]);
  if (!until) return null;
  const ms = new Date(until).getTime() - now;
  if (!(ms > 0)) return null;
  const d = Math.floor(ms / 864e5), h = Math.floor((ms % 864e5) / 36e5), m = Math.floor((ms % 36e5) / 6e4);
  return { d, h, m, text: `${d}d ${h}h ${m}m`, label: `${d} days, ${h} hours and ${m} minutes` };
}
function CampaignHeroTag({ c }) {
  const cd = useCountdown(c.until);
  return (
    <p className="fade mb-4 flex flex-wrap items-center gap-x-3 gap-y-2 md:mb-5">

    </p>
  );
}

}

          <div className="relative h-9 flex-1 overflow-hidden" aria-live="off">
            {msgs.map((m, k) => {
              const d = (k - i + n) % n;

                  }}

                ><span className="truncate">{m.node}</span></div>
              );
            })}
          </div>
        </div>
        <div className="hidden lg:flex items-center justify-end gap-4">
          {cd && <span role="timer" aria-label={`${CAMPAIGN.untilLabel} ${cd.label}`} className="hidden whitespace-nowrap opacity-90 2xl:inline">{CAMPAIGN.untilLabel} <b className="font-semibold tabular-nums">{cd.text}</b></span>}

  const leave = () => { clearTimeout(timer.current); timer.current = setTimeout(() => setOpen(null), 160); };
  useEffect(() => {
    const k = (e) => { if (e.key === 'Escape') setOpen(null); };
    const c = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(null); };

    return () => { window.removeEventListener('keydown', k); document.removeEventListener('pointerdown', c); };

  const icon = `grid place-items-center size-10 rounded-[8px] transition-colors ${hover}`;
  const glass = 'blur(14px) saturate(160%)';
  const panels = [['procedures', MegaMenu], ['concerns', ConcernsMenu], ['about', AboutMenu]];

  return (
    <header
      ref={wrapRef}
      className="fixed inset-x-0 z-50"
      style={{

/* phones: search floats bottom right and steps up above any button already sitting there ([data-float-avoid], or `lift` from the page) */
function FloatSearch({ onOpen, hidden, lift = 0 }) {
  const [avoid, setAvoid] = useState(0);
  useOnScroll(() => {
    const vh = window.innerHeight, vw = window.innerWidth;
    let top = vh;
    document.querySelectorAll('[data-float-avoid]').forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.width && r.top < vh && r.bottom > vh - 120 && r.right > vw - 90) top = Math.min(top, r.top);
    });
    setAvoid(top < vh ? vh - top + 12 : 0);
  }, []);
  const bottom = Math.max(16, avoid, lift);
  return (
    <button type="button" onClick={onOpen} tabIndex={hidden ? -1 : 0} aria-hidden={hidden} aria-label="Search treatments"
      className={`float-search fixed right-4 z-[55] grid size-[52px] place-items-center rounded-full bg-ndm-deep text-white shadow-[0_18px_40px_-16px_rgba(11,15,19,.6)] ring-1 ring-white/10 md:hidden ${hidden ? 'is-off' : ''}`}
      style={{ bottom: `calc(${bottom}px + env(safe-area-inset-bottom))` }}>
      <IconSearch size={22} />
    </button>
  );
}

/* ---------------------------------------------------------------- hero (3 scenes, bottom-to-top) */
function Hero({ sectionRef, onIntroDone }) {
  const stageRef = useRef(null);
  const uiRef = useRef(null);
  const slideEls = useRef([]);
  const cur = useRef(0);
  const busy = useRef(false);
  const pending = useRef(null);
  const ready = useRef(false);
  const [active, setActive] = useState(0);
  const [pre, setPre] = useState(!REDUCED);

  const parts = (k) => {
    const root = slideEls.current[k];
    return {
      root,
      plate: root.querySelector('.plate'),
      img: root.querySelector('.plate img'),
      hl: root.querySelector('.hl'),
      lines: [...root.querySelectorAll('.line-in')],
      fades: [...root.querySelectorAll('.fade')],
    };
  };

  /* first load, Essentia-style: headline blurs in at centre, settles, then the plate rises from below */
  useLayoutEffect(() => {
    if (REDUCED) { onIntroDone(); ready.current = true; return; }
    lockScroll(true);
    window.scrollTo(0, 0);
    let killed = false;
    const anims = [];
    const go = () => {
      if (killed) return;
      const s = parts(0);
      const a = (el, kf, o) => { const x = el.animate(kf, { fill: 'both', ...o }); anims.push(x); return x; };
      const r = s.hl.getBoundingClientRect();
      const off = window.innerHeight / 2 - (r.top + r.height / 2);
      stageRef.current.classList.add('is-intro');
      s.lines.forEach((l, i) => a(l, [
        { opacity: 0, filter: 'blur(18px)', transform: 'translateY(35%)' },
        { opacity: 1, filter: 'blur(0px)', transform: 'translateY(0)' },
      ], { duration: 1000, delay: 120 + i * 150, easing: E.out }));
      a(s.hl, [{ transform: `translate3d(0,${off}px,0)` }, { transform: 'translate3d(0,0,0)' }], { duration: 1400, delay: 1150, easing: E.inout });
      a(s.plate, [{ clipPath: 'inset(100% 0 0 0)' }, { clipPath: 'inset(0% 0 0 0)' }], { duration: 1500, delay: 1000, easing: E.inout });
      a(s.img, [{ transform: 'scale(1.28) translateY(6%)' }, { transform: 'scale(1) translateY(0)' }], { duration: 2400, delay: 1000, easing: E.out });
      s.fades.forEach((f, i) => a(f, [
        { opacity: 0, transform: f.dataset.badge ? 'scale(.82) rotate(-24deg)' : 'translateY(18px)' },
        { opacity: 1, transform: 'none' },
      ], { duration: 900, delay: 2050 + i * 110, easing: E.quart }));
      a(uiRef.current, [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 900, delay: 2350, easing: E.quart });
      setPre(false);
      setTimeout(() => { if (!killed) onIntroDone(); }, 1900);
      setTimeout(() => {
        if (killed) return;
        anims.forEach((x) => x.cancel());
        stageRef.current.classList.remove('is-intro');
        lockScroll(false);
        ready.current = true;
        window.dispatchEvent(new Event('scroll'));
      }, 3300);
    };
    const fontsOk = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 900))]) : Promise.resolve();
    fontsOk.then(() => requestAnimationFrame(go));
    return () => { killed = true; anims.forEach((x) => x.cancel()); lockScroll(false); };
  }, []);

  /* scene change, incoming plate wipes in from the bottom, outgoing plate drifts up */
  const go = useCallback((to) => {
    const from = cur.current;
    if (to === from) return;
    if (busy.current) { pending.current = to; return; }
    const out = parts(from), inn = parts(to), dir = to > from ? 1 : -1;
    cur.current = to; setActive(to);
    inn.root.classList.add('is-on'); inn.root.style.zIndex = 2; out.root.style.zIndex = 1;
    if (REDUCED) { out.root.classList.remove('is-on'); return; }
    busy.current = true;
    const anims = [];
    const a = (el, kf, o) => anims.push(el.animate(kf, { fill: 'both', ...o }));
    out.lines.forEach((l, i) => a(l, [{ transform: 'translateY(0)' }, { transform: `translateY(${-110 * dir}%)` }], { duration: 520, delay: i * 50, easing: E.in3 }));
    out.fades.forEach((f) => a(f, [{ opacity: 1 }, { opacity: 0 }], { duration: 360, easing: E.in3 }));
    a(out.plate, [{ transform: 'translate3d(0,0,0) scale(1)' }, { transform: `translate3d(0,${-dir * 24}vh,0) scale(1.06)` }], { duration: 1250, delay: 80, easing: E.inout });
    a(inn.plate, [
      { clipPath: dir > 0 ? 'inset(100% 0 0 0)' : 'inset(0 0 100% 0)', transform: `translate3d(0,${dir * 30}vh,0)` },
      { clipPath: 'inset(0% 0 0 0)', transform: 'translate3d(0,0,0)' },
    ], { duration: 1250, delay: 80, easing: E.inout });
    a(inn.img, [{ transform: 'scale(1.2)' }, { transform: 'scale(1)' }], { duration: 1800, delay: 80, easing: E.out });
    inn.lines.forEach((l, i) => a(l, [{ transform: `translateY(${110 * dir}%)` }, { transform: 'translateY(0)' }], { duration: 1000, delay: 700 + i * 90, easing: E.quart }));
    inn.fades.forEach((f, i) => a(f, [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], { duration: 700, delay: 950 + i * 80, easing: E.quart }));
    setTimeout(() => {
      out.root.classList.remove('is-on');
      anims.forEach((x) => x.cancel());
      busy.current = false;
      const p = pending.current; pending.current = null;
      if (p != null && p !== cur.current) go(p);
    }, 1500);
  }, []);

  /* scroll position inside the 300vh section picks the scene */
  useOnScroll(() => {
    if (!ready.current || !sectionRef.current) return;
    const vh = window.innerHeight;
    const s = -sectionRef.current.getBoundingClientRect().top;
    const idx = s < 0.55 * vh ? 0 : s < 1.35 * vh ? 1 : 2;
    if (idx !== cur.current || busy.current) go(idx);
  }, []);

  const jump = (k) => {
    const top = sectionRef.current.getBoundingClientRect().top + window.scrollY;
    scrollToY(top + [0, 0.95, 1.75][k] * window.innerHeight);
  };
  const next = () => {
    if (active < 2) return jump(active + 1);
    const r = sectionRef.current.getBoundingClientRect();
    scrollToY(r.bottom + window.scrollY);
  };
  const prev = () => active > 0 && jump(active - 1);

  const onMove = (e) => {
    if (REDUCED) return;
    const el = stageRef.current;
    el.style.setProperty('--mx', (e.clientX / window.innerWidth - 0.5).toFixed(3));
    el.style.setProperty('--my', (e.clientY / window.innerHeight - 0.5).toFixed(3));
  };

  return (
    <section ref={sectionRef} id="top" data-nav="dark" aria-label="Welcome to NewDermaMed" className="relative h-[300vh] bg-ndm-night">
      <div ref={stageRef} onPointerMove={onMove} className={`sticky top-0 h-[100svh] overflow-hidden text-white ${pre ? 'is-pre' : ''}`}>
        {SLIDES.map((s, k) => {

/* ---------------------------------------------------------------- Top Choice Award motion (after NDM's Trust-Animation GIF, rebuilt with the badge images):
   badges appear left to right with their year, then "8", then the words; a short hold, a soft fade, and it loops */
const AWARD_YEARS = [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026];
function AwardsMotion({ className = '' }) {
  const ref = useRef(null);
  const N = AWARD_YEARS.length;
  const [step, setStep] = useState(REDUCED ? N + 3 : 0);
  const [out, setOut] = useState(false);
  useEffect(() => {
    if (REDUCED) return;
    let t = 0, running = false;
    const play = () => {
      setOut(false); setStep(0);
      let i = 0;
      const tick = () => {
        i += 1; setStep(i);
        if (i < N + 3) t = setTimeout(tick, i < N ? 240 : 480);
        else t = setTimeout(() => { setOut(true); t = setTimeout(play, 650); }, 3400);
      };
      t = setTimeout(tick, 250);
    };
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !running) { running = true; play(); }
      else if (!e.isIntersecting && running) { running = false; clearTimeout(t); }
    }, { threshold: 0.2 });
    io.observe(ref.current);
    return () => { io.disconnect(); clearTimeout(t); };
  }, []);
  return (
    <div ref={ref} className={`aw-motion ${out ? 'is-out' : ''} ${className}`}>
      <ul className="aw-row" role="list" aria-label="Top Choice Award, every year from 2019 to 2026">
        {AWARD_YEARS.map((y, i) => (
          <li key={y} className={`aw-b ${step > i ? 'on' : ''}`}>
            <img src={`assets/awards/top-choice-${y}.png`} alt={`Top Choice Award ${y}`} loading="lazy" draggable="false" />
            <span>{y}</span>
          </li>
        ))}
      </ul>
      <p className="aw-txt">
        <span className={`aw-n font-aeonik ${step > N ? 'on' : ''}`}>8</span>
        <span className="aw-words">
          <span className={`aw-t1 font-aeonik ${step > N + 1 ? 'on' : ''}`}>Years of Excellence</span>
          <span className={`aw-t2 font-inter ${step > N + 2 ? 'on' : ''}`}>Toronto’s Top Choice Cosmetic Clinic</span>
        </span>
      </p>
    </div>
  );
}

/* ---------------------------------------------------------------- appear-on-scroll (Essentia-style blur + rise) */
function useReveal(ref) {
  useEffect(() => {
    const root = ref.current; if (!root) return;
    const els = root.querySelectorAll('.rv');
    if (REDUCED || !('IntersectionObserver' in window)) { els.forEach((e) => e.classList.add('in')); return; }
    const io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { rootMargin: '0px 0px -10% 0px' });
    els.forEach((e) => io.observe(e));
    return () => io.disconnect();
  }, []);
}

const BA_HINT_MS = 1600;
const BA_HINT = [[0, 50], [0.3, 34], [0.72, 66], [1, 50]];
const baHintAt = (p) => {
  for (let k = 1; k < BA_HINT.length; k++) {
    const [p0, v0] = BA_HINT[k - 1], [p1, v1] = BA_HINT[k];
    if (p <= p1) return v0 + (v1 - v0) * easeInOut((p - p0) / (p1 - p0));

};

/* compare slider: AFTER photo underneath, BEFORE photo on top, clipped to the left of the divider.
   Mouse and pen grab at once (click to jump, drag to slide). Touch waits for a sideways move or a tap,
   so a vertical swipe over a photo still scrolls the page. Keyboard and screen readers use the native range input. */
function BaCompare({ c, i, nudge = true }) {
  const box = useRef(null), drag = useRef(null), touched = useRef(false), hint = useRef(0);
  const [pos, setPos] = useState(50);
  const [active, setActive] = useState(false); /* a pointer is sliding: the handle grows */
  const [tween, setTween] = useState(false); /* a discrete jump (click, tap, keys): ease into place */
  const seen = useInView(box, { threshold: 0.5 });

  const stopHint = () => { touched.current = true; cancelAnimationFrame(hint.current); };
  const fromX = (x) => {
    const r = box.current.getBoundingClientRect();
    return r.width ? 100 * clamp01((x - r.left) / r.width) : 50;
  };
  const jump = (v) => { stopHint(); setTween(true); setPos(v); };
  const slide = (v) => { setTween(false); setPos(v); };

  useEffect(() => {
    if (!seen || !nudge || REDUCED || touched.current) return;
    let t0 = 0;
    const tick = (t) => {
      if (touched.current) return;
      if (!t0) t0 = t;
      const p = Math.min(1, (t - t0) / BA_HINT_MS);
      slide(baHintAt(p));
      if (p < 1) hint.current = requestAnimationFrame(tick);
    };
    const wait = setTimeout(() => { hint.current = requestAnimationFrame(tick); }, 350 + 150 * i);
    return () => { clearTimeout(wait); cancelAnimationFrame(hint.current); };
  }, [seen]);

  const grab = (e) => {
    try { box.current.setPointerCapture(e.pointerId); } catch (err) { /* pointer already released */ }
    setActive(true);
    jump(fromX(e.clientX));
  };
  const down = (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.pointerType === 'touch' && drag.current && drag.current.on) return; /* a second finger while sliding */
    const now = e.pointerType !== 'touch';
    drag.current = { id: e.pointerId, x: e.clientX, y: e.clientY, on: now };
    if (now) { e.preventDefault(); grab(e); }
  };
  const move = (e) => {
    const d = drag.current; if (!d || d.id !== e.pointerId) return;
    if (!d.on) {
      const dx = Math.abs(e.clientX - d.x), dy = Math.abs(e.clientY - d.y);
      if (dx < 6 || dx <= dy) return;
      d.on = true; grab(e); return;
    }
    slide(fromX(e.clientX));
  };
  const end = (e) => {
    const d = drag.current; if (!d || d.id !== e.pointerId) return;
    drag.current = null;
    if (d.on) { setActive(false); return; }
    if (e.type === 'pointerup' && Math.abs(e.clientX - d.x) < 10 && Math.abs(e.clientY - d.y) < 10) jump(fromX(e.clientX)); /* a tap */
  };
  const lost = (e) => {
    const d = drag.current;
    if (d && d.on && d.id === e.pointerId) { drag.current = null; setActive(false); }
  };
  const key = (e) => {
    const k = e.key;
    const dir = k === 'ArrowLeft' || k === 'ArrowDown' ? -1 : k === 'ArrowRight' || k === 'ArrowUp' ? 1 : 0;
    if (!dir) return; /* Home, End, PageUp and PageDown stay native and arrive through onChange */
    e.preventDefault();
    jump(Math.min(100, Math.max(0, Math.round(pos) + dir * (e.shiftKey ? 10 : 2))));
  };
  const change = (e) => jump(Number(e.target.value));

  const clip = `inset(0 ${(100 - pos).toFixed(3)}% 0 0)`;
  const at = `${pos.toFixed(3)}%`;
  const shown = Math.round(pos);
  const img = 'absolute inset-0 h-full w-full object-cover';
  /* the source photos carry their own Before/After tags in the top corners (about 157x80 of 750x690):
     zooming 1.16x from the bottom edge crops the top 14% so the tags never show; fx keeps each face in frame */
  const crop = { objectPosition: `${c.fx}% 50%`, transformOrigin: `${c.fx}% 100%`, transform: 'scale(1.16)' };
  const pill = 'ba-pill absolute top-3 rounded-full pl-2.5 pr-2 py-[6px] font-inter text-[11.5px] font-medium uppercase leading-none tracking-[.14em] backdrop-blur-[8px]';
  const alt = (w) => `${w} ${(c.treat || 'Aptos thread lift').toLowerCase()}, model ${c.n}`;
  return (
    <div ref={box}
      className={`ba-box relative isolate aspect-[4/5] w-full cursor-ew-resize select-none overflow-hidden rounded-[22px] bg-white/5 ring-1 ring-white/10 focus-within:ring-2 focus-within:ring-ndm-sky focus-within:ring-offset-2 focus-within:ring-offset-[#18222A]${active ? ' is-drag' : ''}${tween ? ' is-tween' : ''}`}
      onPointerDown={down} onPointerMove={move} onPointerUp={end} onPointerCancel={end} onLostPointerCapture={lost}>
      <div className="ba-before absolute inset-0 z-[2]" style={{ clipPath: clip, WebkitClipPath: clip }}>
        <img src={c.before} alt={alt('Before')} width={750} height={690} loading="lazy" decoding="async" draggable={false} className={img} style={crop} />
        <span aria-hidden="true" className={`${pill} left-3 bg-ndm-ink/55 text-white`} style={{ opacity: pos < 12 ? 0 : 1 }}>Before</span>
      </div>
      <div className="absolute inset-0 z-[1]">
        <img src={c.after} alt={alt('After')} width={750} height={690} loading="lazy" decoding="async" draggable={false} className={img} style={crop} />
        <span aria-hidden="true" className={`${pill} right-3 bg-white/85 text-ndm-ink`} style={{ opacity: pos > 88 ? 0 : 1 }}>After</span>
      </div>
      <span aria-hidden="true" className="ba-line absolute inset-y-0 z-[3] w-px -translate-x-1/2 bg-white shadow-[0_0_12px_rgba(11,15,19,.35)]" style={{ left: at }} />
      <span aria-hidden="true" className="ba-handle absolute top-1/2 z-[4] grid size-10 place-items-center rounded-full bg-white text-ndm-ink shadow-[0_10px_24px_-10px_rgba(11,15,19,.55)] ring-1 ring-ndm-ink/10" style={{ left: at }}>
        <BaIconDrag />
      </span>
      <input type="range" min={0} max={100} step={0.5} value={Math.round(pos * 2) / 2}

/* profile dialog: portalled to <body> so it sits above the fixed header; bottom sheet under 640px, centred card above */
function TeamProfile({ m, onClose }) {
  const [on, setOn] = useState(false);
  const box = useRef(null), closeBtn = useRef(null), leaving = useRef(false), timer = useRef(0);
  const close = useCallback(() => {
    if (leaving.current) return;
    leaving.current = true;
    setOn(false);
    timer.current = setTimeout(onClose, REDUCED ? 0 : 420);
  }, [onClose]);
  useEffect(() => {
    lockScroll(true);
    if (closeBtn.current) closeBtn.current.focus({ preventScroll: true });
    let r2 = 0;
    const r1 = requestAnimationFrame(() => { r2 = requestAnimationFrame(() => setOn(true)); });
    return () => { cancelAnimationFrame(r1); cancelAnimationFrame(r2); clearTimeout(timer.current); lockScroll(false); };
  }, []);
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') { close(); return; }
      if (e.key !== 'Tab' || !box.current) return;
      const f = box.current.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])');
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1], cur = document.activeElement;
      if (!box.current.contains(cur)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && cur === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && cur === last) { e.preventDefault(); first.focus(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [close]);

  return (
    <div className={`team-pop fixed inset-0 z-[85] flex items-end justify-center sm:items-center sm:p-6 ${on ? 'is-on' : ''}`}>
      <div aria-hidden="true" onClick={close} className="team-pop-scrim absolute inset-0" />

        className="team-pop-card relative w-full max-w-[880px] overflow-hidden rounded-t-[28px] bg-ndm-paper shadow-[0_40px_90px_-30px_rgba(11,15,19,.55)] sm:rounded-[28px]">

            <button ref={closeBtn} type="button" onClick={close} aria-label="Close profile"
              className="pointer-events-auto mr-3 mt-3 grid size-10 shrink-0 place-items-center rounded-full bg-white/90 text-ndm-ink shadow-[0_8px_20px_-12px_rgba(11,15,19,.45)] transition-colors hover:bg-ndm-ink hover:text-white sm:mr-4 sm:mt-4">
              <IconClose size={18} />
            </button>
          </div>
          <span aria-hidden="true" className="mx-auto mt-3 block h-1 w-10 rounded-full bg-ndm-ink/15 sm:hidden" />
          <div className="grid gap-8 p-6 pt-5 pb-[max(28px,env(safe-area-inset-bottom))] sm:grid-cols-[220px_minmax(0,1fr)] sm:gap-9 sm:p-9 md:grid-cols-[248px_minmax(0,1fr)] md:gap-10 md:p-10">

                </div>
                <TeamFacts facts={m.facts} className="mt-6" />
              </div>
            </aside>
            <div className="min-w-0">
              <p className={`pr-12 ${TEAM_CRED}`}>{m.cred}</p>

const BOOK_INTERESTS = ['Wrinkles & fine lines', 'Volume loss', 'Sagging skin & jowls', 'Dark circles & under-eye hollows', 'Double chin', 'Acne', 'Acne scars', 'Pigmentation & sun spots', 'Aptos Thread Lift', 'Dermal Fillers', 'Laser Hair Removal', 'Microneedling', 'Not sure, I’d like a skin analysis'];
const BOOK_DEPOSIT = 50; /* refundable consultation deposit in dollars: applied to treatment or refunded at the visit */
const BOOK_NOTICE = '24 hours'; /* free reschedule or cancel up to this long before the visit */
const BOOK_FLOW = { book: ['Your concern', 'Your details', 'Clinic, day and time', 'Deposit'], call: ['Your concern', 'Your details', 'Best time to call'] };
const BOOK_CALL_TIMES = ['Morning', 'Afternoon', 'Early evening'];
const BOOK_OTHER = 'Something else'; /* last concern option, opens a short text box */
const BOOK_CLINIC_OPTS = [['Uptown', 'Uptown, Yonge & Sheppard'], ['Downtown', 'Downtown, Bay & College']];
/* opening hours (HOURS): Monday to Friday 9 to 7, Saturday 10 to 5, Sunday closed; a request slot every hour, the last one an hour before closing */
const bookSlots = (d) => { const w = d.getDay(); if (w === 0) return []; const [a, b] = w === 6 ? [10, 16] : [9, 18]; const now = new Date(); const from = d.toDateString() === now.toDateString() ? now.getHours() + 1 : 0; /* today: only times still ahead, since a paid booking holds a real time */ return Array.from({ length: b - a + 1 }, (_, i) => a + i).filter((h) => h >= from); };
const bookHour = (h) => `${h > 12 ? h - 12 : h}:00 ${h >= 12 ? 'pm' : 'am'}`;
const bookDay = (d) => d.toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });
function BookChip({ type = 'radio', name, value, checked, onChange, children }) {
  return (
    <label className="relative inline-flex cursor-pointer">
      <input type={type} name={name} value={value} checked={checked} onChange={onChange} className="peer absolute inset-0 m-0 cursor-pointer opacity-0" />
      <span className="inline-flex min-h-[40px] items-center gap-2 rounded-full border border-ndm-ink/15 bg-white px-3.5 font-inter text-[13.5px] leading-[1.3] text-ndm-ink transition-colors peer-hover:border-ndm-ink/40 peer-checked:border-ndm-deep peer-checked:bg-ndm-deep peer-checked:text-white peer-focus-visible:ring-4 peer-focus-visible:ring-ndm-blue/25">{children}</span>
    </label>
  );
}
/* a month calendar (Sundays and past days closed) and the open request times of the chosen day */
function BookCalendar({ day, time, onDay, onTime }) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const [view, setView] = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));
  const first = (view.getDay() + 6) % 7; /* weeks start on Monday */
  const days = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
  const cells = [...Array(first).fill(null), ...Array.from({ length: days }, (_, i) => new Date(view.getFullYear(), view.getMonth(), i + 1))];
  while (cells.length < 42) cells.push(null); /* always six weeks, so the card never changes height between months */
  const canBack = view > new Date(today.getFullYear(), today.getMonth(), 1);
  const nav = 'grid size-8 place-items-center rounded-full border border-ndm-ink/12 text-ndm-ink transition-colors hover:bg-ndm-mist disabled:opacity-30';
  return (
    <div className="grid gap-4 md:grid-cols-[minmax(0,1fr)_minmax(0,200px)]">
      <div>
        <div className="flex items-center justify-between">
          <p className="font-aeonik text-[19px] text-ndm-ink">{view.toLocaleDateString('en-CA', { month: 'long', year: 'numeric' })}</p>
          <span className="flex gap-1.5">
            <button type="button" disabled={!canBack} onClick={() => setView(new Date(view.getFullYear(), view.getMonth() - 1, 1))} aria-label="Previous month" className={nav}><IconArrow size={12} className="rotate-180" /></button>
            <button type="button" onClick={() => setView(new Date(view.getFullYear(), view.getMonth() + 1, 1))} aria-label="Next month" className={nav}><IconArrow size={12} /></button>
          </span>
        </div>
        <div className="mt-2 grid grid-cols-7 gap-1 text-center font-inter text-[11px] uppercase tracking-[.08em] text-ndm-muted" aria-hidden="true">{['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map((d) => <span key={d} className="py-1">{d}</span>)}</div>
        <div className="grid grid-cols-7 gap-1" role="group" aria-label="Choose a day">
          {cells.map((d, i) => {
            if (!d) return <span key={`e${i}`} />;
            const closed = d < today || !bookSlots(d).length; /* Sundays, past days, and today once its last time has gone */
            const on = day && d.getTime() === day.getTime();
            return (
              <button key={d.getDate()} type="button" disabled={closed} onClick={() => onDay(d)} aria-pressed={on} aria-label={`${bookDay(d)}${closed ? ', closed' : ''}`}
                className={`relative grid h-8 place-items-center rounded-[10px] font-inter text-[13.5px] tabular-nums transition-colors ${on ? 'bg-ndm-deep text-white' : closed ? 'text-ndm-ink/25' : 'bg-white text-ndm-ink ring-1 ring-ndm-ink/10 hover:ring-ndm-deep'}`}>
                {d.getDate()}{!closed && !on && <i aria-hidden="true" className="absolute bottom-1 size-1 rounded-full bg-ndm-sky" />}
              </button>
            );
          })}
        </div>
      </div>
      <div className="min-h-[176px] md:min-h-0">
        <p className="font-inter text-[13px] font-semibold text-ndm-ink">{day ? bookDay(day) : 'Pick a day'}</p>
        {day ? (
          <div className="mt-2 grid grid-cols-3 gap-1.5 md:grid-cols-2" role="group" aria-label="Choose a time">
            {bookSlots(day).map((h) => (
              <button key={h} type="button" onClick={() => onTime(h)} aria-pressed={time === h}
                className={`h-8 rounded-[10px] font-inter text-[13px] tabular-nums transition-colors ${time === h ? 'bg-ndm-deep text-white' : 'bg-white text-ndm-ink ring-1 ring-ndm-ink/10 hover:ring-ndm-deep'}`}>{bookHour(h)}</button>
            ))}
          </div>
        ) : <p className="mt-2 font-inter text-[13px] leading-[1.5] text-ndm-muted">Open days are marked with a dot. Sundays are closed.</p>}
      </div>
    </div>
  );
}
/* consultation booking, shared by the booking section and the Book Free Consultation pop-up: the concern, then contact
   details (so every request reaches the team), then a choice: book a time now with a refundable deposit, or ask us to call.
   Prototype: no payment is taken; the clinic's payment provider opens at the deposit step. */
function BookForm({ thanksId, summary = false }) {
  const box = useRef(null);
  const [step, setStep] = useState(0);
  const [path, setPath] = useState(null); /* 'book' (pick a time, deposit) or 'call' (we call you) */
  const [sent, setSent] = useState(false);
  const [err, setErr] = useState('');
  const [f, setF] = useState({ interest: '', clinic: 'Uptown', day: null, time: null, via: ['Call'], first: '', callTime: '', callClinic: 'Either', agree: false, other: '', visia: true });
  const set = (k, v) => { setErr(''); setF((o) => ({ ...o, [k]: v })); };
  const toggle = (k, v) => { setErr(''); setF((o) => ({ ...o, [k]: o[k].includes(v) ? o[k].filter((x) => x !== v) : [...o[k], v] })); };
  const otherBox = () => box.current && box.current.querySelector('input[name="other"]');
  /* "Something else" opens the text box; "Not sure, I'd like a skin analysis" switches the free VISIA analysis back on */
  const pick = (t) => { setErr(''); setF((o) => ({ ...o, interest: t, visia: t.startsWith('Not sure') ? true : o.visia })); if (t === BOOK_OTHER) setTimeout(() => { const i = otherBox(); if (i) i.focus(); }, 60); };
  const [hold, setHold] = useState(0);
  const flow = BOOK_FLOW[path || 'book'];
  const keyOf = (n, p) => (n < 2 ? String(n) : `${n}${p === 'call' ? 'c' : 'b'}`);
  const cur = keyOf(step, path);
  const go = (n, p = path) => {
    setErr(''); setStep(n);
    setTimeout(() => { const l = box.current && box.current.querySelector(`[data-step="${keyOf(n, p)}"] legend`); if (l) { l.focus({ preventScroll: true }); l.scrollIntoView({ block: 'nearest' }); } }, 30); /* keeps the new step's question in view on phones */
  };
  const detailsOk = () => {
    const fs = box.current && box.current.querySelector('[data-step="1"]');
    const bad = fs ? [...fs.querySelectorAll('input[required]')].find((i) => !i.checkValidity()) : null;
    if (bad) { setErr('Please add your name, mobile number and a valid email.'); bad.focus(); return false; }
    if (!f.via.length) { setErr('Please choose at least one way to reach you.'); return false; }
    return true;
  };
  const choose = (p) => { if (!detailsOk()) return; setPath(p); go(2, p); };
  const next = () => {
    if (step === 0 && !f.interest) { setErr('Please choose one option.'); return; }
    if (step === 0 && f.interest === BOOK_OTHER && !f.other.trim()) { setErr('Please tell us in a few words what you’d like to address.'); const i = otherBox(); if (i) i.focus(); return; }
    if (step === 2 && path === 'book' && (!f.day || !f.time)) { setErr('Please pick a day and a time.'); return; }
    go(step + 1);
  };
  const submit = (e) => {
    e.preventDefault();
    if (step === 1) { setErr('Choose how to continue: book a time now, or have us call you.'); return; }
    if (step < flow.length - 1) { next(); return; }
    if (path === 'call' && !f.callTime) { setErr('Please choose a time of day.'); return; }
    if (path === 'book' && !f.agree) { setErr('Please confirm the deposit terms.'); return; }
    setHold(box.current ? box.current.offsetHeight : 0); setSent(true);
  };
  const reset = () => { setSent(false); setPath(null); setF((o) => ({ ...o, interest: '', other: '', visia: true, day: null, time: null, callTime: '', agree: false })); go(0, null); };
  const when = f.day && f.time ? `${bookDay(f.day)}, ${bookHour(f.time)}` : null;
  const clinicName = (v) => (v === 'Either' ? 'Either clinic' : BOOK_CLINIC_OPTS.find(([x]) => x === v)[1]);
  const clinicPhone = (CLINICS.find((c) => c.name === f.clinic) || CLINICS[0]).phone;
  const legend = 'scroll-mt-24 font-aeonik text-[clamp(21px,1.9vw,26px)] font-normal leading-[1.15] tracking-[-0.02em] text-ndm-ink outline-none';
  const label = 'mb-1.5 block font-inter text-[13px] font-semibold text-ndm-ink';
  const tile = 'flex min-h-[64px] items-center gap-3 rounded-[14px] border px-4 py-3 text-left font-inter transition-colors focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-ndm-blue/25';
  const concern = f.interest === BOOK_OTHER ? (f.other.trim() || BOOK_OTHER) : f.interest;
  const visiaRow = ['VISIA® skin analysis', f.visia ? 'Included, free' : 'Not added'];
  const rows = path === 'call'
    ? [['Concern', concern], visiaRow, ['Next step', 'We call you'], ['Best time', f.callTime], ['Clinic', clinicName(f.callClinic)]]
    : [['Concern', concern], visiaRow, ['Clinic', clinicName(f.clinic)], ['Day and time', when], ['Deposit', `$${BOOK_DEPOSIT}, refundable`]];
  const stepCls = (k) => `book-step ${cur === k ? '' : 'is-off'}`;
  const stepAttr = (k) => ({ 'aria-hidden': cur !== k || undefined, inert: cur !== k ? '' : undefined });

  if (sent) return (
    <div role="status" className="flex flex-1 flex-col items-start justify-center gap-3 py-4" style={{ minHeight: hold || undefined }}>
      <span aria-hidden="true" className="grid size-12 place-items-center rounded-full bg-ndm-amber text-white"><IconCheckBadge /></span>
      {path === 'book' ? (<>
        <p id={thanksId} className="font-aeonik text-[clamp(24px,2.2vw,30px)] leading-[1.15] tracking-[-0.02em] text-ndm-ink">You’re booked{f.first ? `, ${f.first}` : ''}.</p>
        <p className="max-w-[46ch] font-inter text-[14.5px] leading-[1.55] text-ndm-muted">Your free consultation{f.visia ? ', with your VISIA® skin analysis,' : ''} is on <b className="font-semibold text-ndm-ink">{when}</b> at our {f.clinic} clinic. Your ${BOOK_DEPOSIT} deposit is applied to any treatment you choose, or refunded at your visit. You’ll receive the details by email and text.</p>
        <p className="font-inter text-[13px] leading-[1.5] text-ndm-muted">Need to change it? Call <a href={tel(clinicPhone)} className="font-semibold text-ndm-ink hover:underline">{clinicPhone}</a> at least {BOOK_NOTICE} before.</p>
      </>) : (<>
        <p id={thanksId} className="font-aeonik text-[clamp(24px,2.2vw,30px)] leading-[1.15] tracking-[-0.02em] text-ndm-ink">Request sent{f.first ? `, ${f.first}` : ''}.</p>
        <p className="max-w-[46ch] font-inter text-[14.5px] leading-[1.55] text-ndm-muted">We’ll call you in the <b className="font-semibold text-ndm-ink">{f.callTime.toLowerCase()}</b> within one business day to find a time for your consultation{f.visia ? ' and VISIA® skin analysis' : ''}.</p>
      </>)}
      <button type="button" onClick={reset} className="font-inter text-[14px] font-semibold text-ndm-deep hover:underline">Book another visit</button>
    </div>
  );

  const body = (
    <form ref={box} onSubmit={submit} noValidate className="flex min-w-0 flex-1 flex-col">
      <div className="grid gap-1.5" style={{ gridTemplateColumns: `repeat(${flow.length},minmax(0,1fr))` }} aria-hidden="true">
        {flow.map((s, i) => <span key={s} className={`h-1 rounded-full transition-colors duration-500 ${i <= step ? 'bg-ndm-deep' : 'bg-ndm-ink/10'}`} />)}
      </div>
      <p className="mt-2 font-inter text-[12.5px] text-ndm-muted">Step {step + 1} of {flow.length} · <span className="text-ndm-ink">{flow[step]}</span></p>

      <div className="book-steps mt-5 grid">
        <fieldset data-step="0" className={stepCls('0')} {...stepAttr('0')}>
          <legend tabIndex={-1} className={legend}>What would you like to address?</legend>
          <div className="mt-4 flex flex-wrap gap-1.5">
            {[...BOOK_INTERESTS, BOOK_OTHER].map((t) => <BookChip key={t} name="interest" value={t} checked={f.interest === t} onChange={() => pick(t)}>{t}</BookChip>)}
          </div>
          {f.interest === BOOK_OTHER && (
            <label className="mt-3 block max-w-[440px]"><span className={label}>Tell us in a few words</span>
              <input name="other" maxLength={80} autoComplete="off" value={f.other} onChange={(e) => set('other', e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); next(); } }}
                placeholder="For example: neck lines, or a treatment you have in mind" className={`${fieldCls} !h-11`} /></label>
          )}
          <label className="mt-5 flex cursor-pointer items-center gap-3 rounded-[14px] border border-ndm-ink/12 bg-white px-4 py-3 font-inter">
            <span className="min-w-0 flex-1"><span className="block text-[14px] font-semibold text-ndm-ink">Include my free VISIA® skin analysis</span><span className="mt-0.5 block text-[12.5px] leading-[1.45] text-ndm-muted">So you and your provider can see your skin in detail before planning anything.</span></span>
            <input type="checkbox" role="switch" name="visia" checked={f.visia} onChange={(e) => set('visia', e.target.checked)} className="peer sr-only" />
            <span aria-hidden="true" className="relative h-6 w-11 shrink-0 rounded-full bg-ndm-ink/20 transition-colors after:absolute after:left-0.5 after:top-0.5 after:size-5 after:rounded-full after:bg-white after:shadow-[0_1px_3px_rgba(11,15,19,.3)] after:transition-transform peer-checked:bg-ndm-deep peer-checked:after:translate-x-5 peer-focus-visible:ring-4 peer-focus-visible:ring-ndm-blue/25" />
          </label>
        </fieldset>
        <fieldset data-step="1" className={stepCls('1')} {...stepAttr('1')}>
          <legend tabIndex={-1} className={legend}>How can we reach you?</legend>
          <div className="mt-4 grid gap-2.5 sm:grid-cols-2">
            <label><span className={label}>First name</span><input required name="first" autoComplete="given-name" value={f.first} onChange={(e) => set('first', e.target.value)} className={`${fieldCls} !h-11`} /></label>
            <label><span className={label}>Last name</span><input required name="last" autoComplete="family-name" className={`${fieldCls} !h-11`} /></label>
            <label><span className={label}>Mobile number</span><input required type="tel" name="phone" autoComplete="tel" className={`${fieldCls} !h-11`} /></label>
            <label><span className={label}>Email</span><input required type="email" name="email" autoComplete="email" className={`${fieldCls} !h-11`} /></label>
          </div>
          <div role="group" aria-label="Best way to reach you, choose any" className="mt-4 flex flex-wrap items-center gap-1.5">
            <span className="mr-1.5 font-inter text-[13px] font-semibold text-ndm-ink">Reach me by</span>
            {['Call', 'Text', 'Email'].map((t) => <BookChip key={t} type="checkbox" name="via" value={t} checked={f.via.includes(t)} onChange={() => toggle('via', t)}>{t}</BookChip>)}
          </div>
          <p className="mt-3 font-inter text-[12px] text-ndm-muted">Please don’t include medical details. We use your details only to arrange your visit.</p>
          <p className="mt-5 font-inter text-[13px] font-semibold text-ndm-ink">How would you like to continue?</p>

/* the space (Makeupy "Makeup session"): a small video under the heading grows to full screen as you scroll,
   then, like the hero slides, each further scroll step brings the next clinic video in from the right */
function Space() {
  const track = useRef(null), stage = useRef(null), head = useRef(null), frame = useRef(null), ui = useRef(null);
  const layers = useRef([]), vids = useRef([]);
  const [idx, setIdx] = useState(0);
  useEffect(() => {
    const st = stage.current; if (!st) return;
    const io = new IntersectionObserver(([e]) => vids.current.forEach((v) => {
      if (!v) return;
      if (e.isIntersecting && !REDUCED) { const p = v.play(); if (p && p.catch) p.catch(() => {}); } else v.pause();
    }));
    io.observe(st);
    return () => io.disconnect();
  }, []);
  useOnScroll(() => {
    const el = track.current, f = frame.current, h = head.current; if (!el || !f || !h) return;
    const r = el.getBoundingClientRect(), vh = window.innerHeight, vw = window.innerWidth;
    const p = REDUCED ? 1 : clamp01(-r.top / Math.max(1, r.height - vh));
    /* phase 1 (0 to .3): grow from a card under the heading to the full screen */
    const g = easeInOut(clamp01(p / 0.3));
    const top0 = h.offsetTop + h.offsetHeight + 28;
    const w0 = vw < 768 ? vw * 0.84 : Math.min(600, Math.max(380, vw * 0.36));
    const s0 = Math.min(w0 / vw, Math.max(0.2, (vh - top0 - 24) / vh));
    const s = s0 + (1 - s0) * g;
    const dy = (top0 + (vh * s0) / 2 - vh / 2) * (1 - g);
    f.style.transform = `translate3d(0,${dy.toFixed(1)}px,0) scale(${s.toFixed(4)})`;
    f.style.borderRadius = `${((24 * (1 - g)) / s).toFixed(2)}px`;
    h.style.opacity = (1 - clamp01((g - 0.35) / 0.4)).toFixed(3);
    h.style.transform = `translate3d(0,${(-40 * g).toFixed(1)}px,0)`;
    if (ui.current) ui.current.style.opacity = clamp01((g - 0.8) / 0.2).toFixed(3);
    stage.current.dataset.nav = g > 0.92 ? 'dark' : '';
    /* phase 2: like the hero slides, crossing a scroll point swaps the video; the slide itself runs on its own timing */
    setIdx(REDUCED ? 0 : p < 0.52 ? 0 : p < 0.78 ? 1 : 2);
  }, []);
  const glass = { background: 'rgba(11,15,19,.35)', backdropFilter: 'blur(22px)', WebkitBackdropFilter: 'blur(22px)' };
  const s = SPACE[idx];
  return (
    <section aria-labelledby="space" className="relative z-10 bg-ndm-paper">
      <div ref={track} className="relative" style={{ height: REDUCED ? '100vh' : '340vh' }}>
        <div ref={stage} className="sticky top-0 h-screen overflow-hidden">
          <div ref={head} className="absolute inset-x-0 top-[clamp(104px,14vh,150px)] px-[var(--gx)] text-center will-change-transform">
            <p className="eyebrow font-mont">
              <span className="eyebrow-mark" aria-hidden="true"><img src="assets/icons/logo-mark.svg" alt="" /></span>The space
            </p>
            <TwoTone id="space" className="mx-auto mt-4" size="text-[clamp(32px,min(4.2vw,7vh),62px)]" lead={<>Step inside<br className="hidden sm:block" /></>} strong="NewDermaMed" />
            <p className="mx-auto mt-3 max-w-[52ch] font-inter text-[15px] leading-[1.55] text-ndm-muted">A 16-year Toronto clinic for cosmetic, laser and dermatology care. Keep scrolling to walk through.</p>
          </div>
          <div ref={frame} className="absolute inset-0 overflow-hidden bg-ndm-slate will-change-transform" style={{ transformOrigin: '50% 50%' }}>
            {SPACE.map((x, i) => (
              <div key={x.v} ref={(el) => (layers.current[i] = el)} className="absolute inset-0 overflow-hidden will-change-transform"
                style={{ zIndex: i + 1, transform: i > idx ? 'translate3d(100%,0,0)' : i < idx ? 'translate3d(-16%,0,0)' : 'none', filter: i < idx ? 'brightness(.5)' : 'none', transition: REDUCED ? 'none' : 'transform 1.2s var(--e-inout), filter 1.2s ease' }}>
                <SpaceClip x={x} vref={(el) => (vids.current[i] = el)} />
              </div>
            ))}
            <div className="absolute inset-0 z-[5] bg-gradient-to-t from-black/45 via-black/0 to-black/25" />
            <div ref={ui} className="absolute inset-0 z-[6]" style={{ opacity: 0 }}>
              <div className="absolute right-[var(--gx)] top-[clamp(104px,14vh,130px)] flex items-center gap-3 rounded-full px-[14px] py-2 font-inter text-[13px] text-white" style={glass}>
                <span className="tabular-nums">0{idx + 1} / 0{SPACE.length}</span>
                <span className="flex gap-1">{SPACE.map((_, i) => <i key={i} className={`h-1 rounded-full bg-white transition-all duration-500 ${i === idx ? 'w-4' : 'w-1 opacity-50'}`} />)}</span>
              </div>
              <div key={idx} className="space-in absolute bottom-[clamp(64px,12vh,128px)] left-[var(--gx)] right-[var(--gx)] rounded-[20px] p-6 text-white md:right-auto md:w-[420px]" style={glass}>
                <p className="font-inter text-[13px] text-white/70">NewDermaMed Toronto</p>
                <p className="mt-2 font-inter text-[22px] font-medium tracking-[-0.02em] md:text-[24px]">{s.t}</p>
                <p className="mt-2 font-inter text-[14px] leading-[1.5] text-white/85">{s.d}</p>
                <div className="mt-4 flex flex-wrap gap-2">{s.chips.map((c) => <span key={c} className="rounded-full border border-white/30 px-3 py-1.5 font-inter text-[12px]">{c}</span>)}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

/* one testimonials row: drifts on its own (rAF) and loops for ever; it can be dragged with a mouse or finger
   and pushed sideways with a trackpad swipe, then carries on drifting */
const REV_COPIES = 3;
function ReviewRow({ items, dir = 1, dur = 28, hidden }) {
  const wrap = useRef(null), track = useRef(null);
  useEffect(() => {
    const w = wrap.current, el = track.current; if (!w || !el) return;
    let x = 0, last = 0, raf = 0, period = 0, drag = null, on = true, idle = 0;
    const measure = () => { period = el.scrollWidth / REV_COPIES; };
    measure();
    const ro = new ResizeObserver(measure); ro.observe(el);
    const io = new IntersectionObserver(([e]) => { on = e.isIntersecting; });
    io.observe(w);
    const tick = (t) => {
      const dt = last ? Math.min(64, t - last) : 0; last = t;
      if (on && !drag && !REDUCED && period && t > idle) x += dir * (period / (dur * 1000)) * dt;
      if (period) x = ((x % period) + period) % period;
      el.style.transform = `translate3d(${(-x).toFixed(2)}px,0,0)`;
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    /* trackpad: a mostly sideways swipe moves the row; vertical scrolling still scrolls the page */
    const wheel = (e) => {
      if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
      e.preventDefault(); e.stopPropagation(); /* keep the smooth-scroll library from also acting on it */
      x += e.deltaX; idle = performance.now() + 900;
    };
    const down = (e) => { if (e.button !== 0) return; drag = { x0: e.clientX, s: x, moved: false }; };
    const move = (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x0;
      if (!drag.moved && Math.abs(dx) > 5) { drag.moved = true; w.classList.add('is-dragging'); }
      if (drag.moved) x = drag.s - dx;
    };
    const up = () => {
      if (!drag) return;
      if (drag.moved) { const stop = (ev) => { ev.preventDefault(); ev.stopPropagation(); }; w.addEventListener('click', stop, { capture: true, once: true }); setTimeout(() => w.removeEventListener('click', stop, true), 60); }
      drag = null; idle = performance.now() + 600; w.classList.remove('is-dragging');
    };
    w.addEventListener('wheel', wheel, { passive: false });
    w.addEventListener('pointerdown', down);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    return () => { cancelAnimationFrame(raf); io.disconnect(); ro.disconnect(); w.removeEventListener('wheel', wheel); w.removeEventListener('pointerdown', down); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); };
  }, []);
  const all = Array.from({ length: REV_COPIES }, () => items).flat();
  return (
    <div ref={wrap} className="promo-rev-row overflow-hidden" onDragStart={(e) => e.preventDefault()}>
      {/* the right padding equals the gap, so one copy plus its gap is exactly a third of the track and the loop has no jump */}
      <ul ref={track} role="list" aria-hidden={hidden} className="flex w-max items-stretch gap-4 pr-4 will-change-transform">
        {all.map((r, i) => <PromoReviewCard key={i} r={r} />)}
      </ul>
    </div>
  );
}

const money = (n) => '$' + n.toLocaleString('en-CA', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });

/* ---------------------------------------------------------------- cart (kept in this browser only; the clinic store takes over at checkout) */
const CartCtx = React.createContext(null);
const CART_KEY = 'ndm-cart';
const CART_MAX = 20;
function useCartState() {
  const [lines, setLines] = useState(() => {
    try { const v = JSON.parse(localStorage.getItem(CART_KEY)); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  });
  useEffect(() => { try { localStorage.setItem(CART_KEY, JSON.stringify(lines)); } catch (e) { /* storage blocked: the cart lasts for this visit */ } }, [lines]);
  const setQty = (line, qty) => setLines((ls) => {
    const i = ls.findIndex((l) => l.key === line.key);
    if (qty <= 0) return ls.filter((l) => l.key !== line.key);
    if (i < 0) return [...ls, { ...line, qty }];
    const next = ls.slice(); next[i] = { ...next[i], qty }; return next;
  });
  const qtyOf = (key) => { const l = lines.find((x) => x.key === key); return l ? l.qty : 0; };
  const count = lines.reduce((n, l) => n + l.qty, 0);
  const total = lines.reduce((n, l) => n + l.qty * l.price, 0);
  const saved = lines.reduce((n, l) => n + (l.was ? l.qty * (l.was - l.price) : 0), 0);
  return { lines, setQty, qtyOf, count, total, saved };
}

/* Add to cart turns into a quantity stepper once the option is in the cart */
function QtyControl({ line, label }) {
  const cart = React.useContext(CartCtx);
  const q = cart.qtyOf(line.key);
  if (!q) {
    return <button type="button" onClick={() => cart.setQty(line, 1)} aria-label={`Add ${label} to cart`} className="btn btn-sm btn-buy pr-add"><span>Add to cart</span></button>;
  }
  return (
    <div className="pr-qty" role="group" aria-label={`Quantity, ${label}`}>
      <button type="button" onClick={() => cart.setQty(line, q - 1)} aria-label={q === 1 ? `Remove ${label} from cart` : `One less, ${label}`}>{q === 1 ? <IconTrash /> : <IconMinusSm />}</button>
      <output aria-live="polite">{q}</output>
      <button type="button" onClick={() => cart.setQty(line, Math.min(CART_MAX, q + 1))} disabled={q >= CART_MAX} aria-label={`One more, ${label}`}><IconPlusSm /></button>
    </div>
  );
}

/* ---------------------------------------------------------------- floating cart bar (every page). Hidden on the first screen and over
   [data-pill-avoid] areas (the home header slides; data-pill-avoid="mobile" only under 768px); the floating search steps above it. */
function CartPill({ onOpen, hidden }) {
  const cart = React.useContext(CartCtx);
  const [bump, setBump] = useState(0);
  const [away, setAway] = useState(true);
  const last = useRef(cart.count);
  useEffect(() => { if (cart.count > last.current) setBump((b) => b + 1); last.current = cart.count; }, [cart.count]);
  useOnScroll(() => {
    const vh = window.innerHeight;
    let a = window.scrollY < vh * 0.5;
    document.querySelectorAll('[data-pill-avoid]').forEach((el) => {
      if (el.dataset.pillAvoid === 'mobile' && window.innerWidth >= 768) return;
      const r = el.getBoundingClientRect();
      if (r.top < vh - 20 && r.bottom > vh - 90) a = true;
    });
    setAway(a);
  }, []);
  const show = cart.count > 0 && !hidden && !away;
  return (
    <button type="button" onClick={onOpen} tabIndex={show ? 0 : -1} aria-hidden={!show} data-float-avoid=""
      onTransitionEnd={(e) => { if (e.propertyName === 'transform') window.dispatchEvent(new Event('scroll')); }}
      aria-label={`View cart, ${cart.count} ${cart.count === 1 ? 'item' : 'items'}, ${money(cart.total)}`}
      className={`cart-pill fixed inset-x-4 bottom-4 z-[60] flex items-center gap-3 rounded-full bg-ndm-deep py-2 pl-2 pr-2 text-left text-white shadow-[0_24px_50px_-20px_rgba(11,15,19,.6)] sm:inset-x-auto sm:right-6 sm:bottom-6 ${show ? '' : 'is-off'}`}>
      <span className="relative grid size-11 shrink-0 place-items-center rounded-full bg-white/10">
        <IconBag size={20} />
        <span key={bump} className="cart-bump absolute -right-0.5 -top-0.5 grid h-[18px] min-w-[18px] place-items-center rounded-full bg-ndm-sky px-1 font-inter text-[11px] font-semibold leading-none text-white">{cart.count}</span>
      </span>
      <span className="min-w-0 flex-1 sm:flex-none">
        <span className="block font-inter text-[12px] leading-none text-white/60">{cart.count} {cart.count === 1 ? 'item' : 'items'}</span>
        <span className="mt-1 block font-inter text-[16px] font-semibold leading-none tabular-nums">{money(cart.total)}</span>
      </span>
      <span className="ml-1 rounded-full bg-white px-4 py-2.5 font-inter text-[14px] font-medium text-ndm-ink">View cart</span>
    </button>
  );

/* ---------------------------------------------------------------- mouse users can grab and drag any sideways-scrolling row */
(function dragScroll() {
  if (window.__ndmDrag) return; window.__ndmDrag = true;
  let el = null, x0 = 0, s0 = 0, moved = false;
  const scroller = (t) => {
    for (let n = t; n && n !== document.body; n = n.parentElement) {
      if (n.matches && n.matches('.ba-box,input,textarea,select,button.sw-ctrl,[data-no-drag]')) return null;
      const cs = getComputedStyle(n);
      if ((cs.overflowX === 'auto' || cs.overflowX === 'scroll') && n.scrollWidth > n.clientWidth + 4) return n;
    }
    return null;
  };
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    el = scroller(e.target); if (!el) return;
    x0 = e.clientX; s0 = el.scrollLeft; moved = false;
  });
  window.addEventListener('pointermove', (e) => {
    if (!el) return;
    const dx = e.clientX - x0;
    if (!moved && Math.abs(dx) > 5) { moved = true; el.classList.add('is-grab'); }
    if (moved) el.scrollLeft = s0 - dx;
  });
  window.addEventListener('pointerup', () => {
    if (!el) return;
    const t = el; el = null; t.classList.remove('is-grab');
    if (moved) { const stop = (ev) => { ev.preventDefault(); ev.stopPropagation(); }; t.addEventListener('click', stop, { capture: true, once: true }); setTimeout(() => t.removeEventListener('click', stop, true), 60); }
  });
  document.addEventListener('dragstart', (e) => { if (e.target.closest && e.target.closest('.overflow-x-auto')) e.preventDefault(); });
})();

/* soft two-note chime when the chat pop-up's message arrives. Browsers only allow sound after the visitor has clicked,
   tapped or pressed a key on the page, so on a first, untouched visit the pop-up appears silently. */
let CHIME_CTX = null;
const chimeUnlock = () => { try { if (!CHIME_CTX) CHIME_CTX = new (window.AudioContext || window.webkitAudioContext)(); if (CHIME_CTX.state === 'suspended') CHIME_CTX.resume(); } catch (e) {} };
['pointerdown', 'keydown', 'touchend'].forEach((ev) => window.addEventListener(ev, chimeUnlock, { once: true, passive: true }));
function chatChime() {
  const c = CHIME_CTX; if (!c || c.state !== 'running') return;
  const t0 = c.currentTime + 0.02;
  [[880, 0], [1318.5, 0.12]].forEach(([f, d]) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0 + d); g.gain.linearRampToValueAtTime(0.11, t0 + d + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.55);
    o.connect(g); g.connect(c.destination); o.start(t0 + d); o.stop(t0 + d + 0.6);
  });
}

/* ---------------------------------------------------------------- booking form (hero card on desktop, its own block on phones) */
function ProcForm({ id, className = '' }) {

};
const txIcon = (label) => (/type/i.test(label) ? 'type' : /duration|session/i.test(label) ? 'clock' : /recovery|downtime/i.test(label) ? 'leaf' : 'cal');

/* treatment at a glance: a white strip that sits half over the bottom of the header photo (its own height is measured, so the
   overlap stays at half on every screen), an icon per fact and both phone numbers. The hero gets the same extra room at its
   bottom so the card never covers its text. A region rather than a section, so page-wide section backgrounds never cover the photo */
function TxGlance({ p }) {
  const card = useRef(null);
  const [half, setHalf] = useState(48);
  useLayoutEffect(() => {
    const el = card.current; if (!el) return;
    const fit = () => setHalf(Math.round(el.offsetHeight / 2));
    fit();
    const ro = new ResizeObserver(fit);
    ro.observe(el);
    /* re-measure once styles and fonts have settled, in case the observer is throttled (background tabs) */
    window.addEventListener('load', fit);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    const t = setTimeout(fit, 900);
    return () => { ro.disconnect(); window.removeEventListener('load', fit); clearTimeout(t); };
  }, []);
  return (
    <div role="region" aria-labelledby="glance-title" className="tx-glance relative z-20 px-[var(--gx)]" style={{ marginTop: -half }}>
      <style>{`section[aria-labelledby="proc-title"]>.grid{padding-bottom:calc(${half}px + clamp(28px,4.5vw,64px))}`}</style>
      <h2 id="glance-title" className="sr-only">Treatment at a glance</h2>
      <div ref={card} className={`${TX_WRAP} grid gap-4 rounded-[24px] bg-white p-4 shadow-[0_30px_60px_-36px_rgba(11,15,19,.55)] ring-1 ring-ndm-ink/[.06] sm:p-5 lg:grid-cols-[minmax(0,1fr)_auto] lg:items-center lg:gap-6 lg:px-7`}>

                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">{TX_ICONS[txIcon(k)]}</svg>
              </span>
              <div className="min-w-0">
                <dt className="font-inter text-[12px] leading-[1.3] text-ndm-muted">{k}</dt>
                <dd className="font-inter text-[15px] font-semibold leading-[1.3] text-ndm-ink sm:text-[16px]">{v}</dd>
              </div>
            </div>
          ))}
        </dl>
        <div className="grid grid-cols-2 gap-2 lg:w-[230px] lg:grid-cols-1">

            </a>
          ))}
        </div>
      </div>
    </div>
  );
}

/* sticky row of section links (the reference's numbered side list, as a modern pill bar); highlights the section in view */
function TxNav({ p }) {
  const [on, setOn] = useState(p.nav[0][0]);
  const bar = useRef(null);
  useEffect(() => {
    const els = p.nav.map(([id]) => document.getElementById(id)).filter(Boolean);
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => { if (e.isIntersecting) setOn(e.target.id); });
    }, { rootMargin: '-45% 0px -50% 0px' });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
  useEffect(() => {
    const b = bar.current && bar.current.querySelector(`[data-k="${on}"]`);
    const r = bar.current && bar.current.querySelector('.tx-nav-scroll');
    if (b && r) r.scrollTo({ left: b.offsetLeft - r.clientWidth / 2 + b.offsetWidth / 2, behavior: REDUCED ? 'auto' : 'smooth' });
  }, [on]);
  const go = (e, id) => { const el = document.getElementById(id); if (!el) return; e.preventDefault(); scrollToY(el.getBoundingClientRect().top + window.scrollY - 160); };
  return (
    <nav ref={bar} aria-label="On this page" className="tx-nav sticky top-[100px] z-30 mt-8 bg-ndm-paper/85 backdrop-blur-[10px] xl:top-[120px]">
      <div className="tx-nav-scroll no-scrollbar relative overflow-x-auto px-[var(--gx)] py-2.5">
      <ul className="relative mx-auto flex w-max gap-1" role="list">
        {p.nav.map(([id, label], i) => (
          <li key={id} data-k={id} className="shrink-0">
            <a href={`#${id}`} onClick={(e) => go(e, id)} aria-current={on === id ? 'true' : undefined}
              className={`flex items-center gap-1.5 whitespace-nowrap rounded-full px-3 py-2 font-inter text-[13px] transition-colors ${on === id ? 'bg-ndm-deep text-white' : 'text-ndm-ink/75 hover:bg-white hover:text-ndm-ink'}`}>
              <span className={`tabular-nums text-[11.5px] ${on === id ? 'text-white/70' : 'text-ndm-muted'}`}>{String(i + 1).padStart(2, '0')}</span>{label}
            </a>
          </li>
        ))}
      </ul>
      </div>
    </nav>
  );
}

/* what to expect: a sticky heading on the left, a scroll-lit journey on the right (the line fills and each step lights up as it passes) */
function TxExpect({ p }) {
  const ref = useRef(null), list = useRef(null), fill = useRef(null);
  useReveal(ref);
  const t = p.expect;
  const [act, setAct] = useState(0);
  const n = txNum(p, 'expect');
  useOnScroll(() => {
    const el = list.current; if (!el) return;
    const r = el.getBoundingClientRect(), mid = window.innerHeight * 0.55;
    const prog = clamp01((mid - r.top) / Math.max(1, r.height));
    if (fill.current) fill.current.style.transform = `scaleY(${REDUCED ? 1 : prog.toFixed(3)})`;
    const items = [...el.querySelectorAll('[data-step]')];
    let k = 0; items.forEach((li, i) => { if (li.getBoundingClientRect().top < mid) k = i; });
    setAct(k);
  }, []);
  return (
    <section ref={ref} id="expect" aria-labelledby="expect-title" className="relative z-10 scroll-mt-[170px] bg-ndm-paper px-[var(--gx)] py-[clamp(64px,7vw,104px)]">
      <div className={`${TX_WRAP} grid gap-10 lg:grid-cols-[minmax(0,.8fr)_minmax(0,1.2fr)] lg:gap-[clamp(48px,6vw,96px)]`}>
        <div className="lg:sticky lg:top-[200px] lg:self-start">
          <Eyebrow className="rv">{n && <span className="tabular-nums text-ndm-deep">{n}</span>}{t.tag || 'What to expect'}</Eyebrow>
          <TwoTone id="expect-title" className="rv mt-5" size="text-[clamp(32px,3.4vw,50px)]" lead={twoLine(t.lead)} strong={t.strong} style={{ transitionDelay: '.06s' }} />
          {t.text && <p className="rv mt-4 max-w-[44ch] font-inter text-[16px] leading-[1.65] text-ndm-muted">{t.text}</p>}
          <div className="rv mt-8 hidden items-center gap-4 lg:flex" aria-hidden="true">
            <span className="font-aeonik text-[44px] leading-none tracking-[-0.04em] text-ndm-deep tabular-nums">0{act + 1}</span>
            <span className="font-inter text-[14px] leading-[1.4] text-ndm-muted">of 0{t.items.length}<br /><span className="text-ndm-ink">{t.items[act][0]}</span></span>
          </div>
          <div className="rv mt-8"><Btn href="#/book" v="book" hot>Book Free Consultation</Btn></div>
        </div>
        <ol ref={list} className="relative grid gap-4" role="list">
          <span aria-hidden="true" className="absolute bottom-6 left-[19px] top-6 w-[2px] rounded-full bg-ndm-ink/[.08]"><i ref={fill} className="block h-full w-full origin-top rounded-full bg-gradient-to-b from-ndm-sky to-ndm-deep" style={{ transform: 'scaleY(0)' }} /></span>
          {t.items.map(([w, h, d], i) => {
            const on = i <= act;
            return (
              <li key={w} data-step="" className="rv relative pl-14" style={{ transitionDelay: `${0.06 * i}s` }}>
                <span aria-hidden="true" className={`absolute left-0 top-5 grid size-10 place-items-center rounded-full font-inter text-[13px] font-semibold tabular-nums transition-colors duration-500 ${on ? 'bg-ndm-deep text-white shadow-[0_10px_22px_-10px_rgba(15,128,195,.9)]' : 'bg-white text-ndm-muted ring-1 ring-ndm-ink/10'}`}>{String(i + 1).padStart(2, '0')}</span>
                <div className={`rounded-[22px] bg-white p-5 transition-[box-shadow,transform] duration-500 md:p-6 ${i === act ? 'shadow-[0_24px_50px_-30px_rgba(15,128,195,.45)] ring-1 ring-ndm-blue/25' : 'ring-1 ring-ndm-ink/[.06]'}`}>
                  <span className="inline-flex rounded-full bg-ndm-blue/10 px-3 py-1 font-inter text-[12.5px] font-semibold text-ndm-deep">{w}</span>
                  <h3 className="mt-3 font-aeonik text-[clamp(21px,1.8vw,25px)] font-normal leading-[1.2] tracking-[-0.01em] text-ndm-ink">{h}</h3>
                  <p className="mt-2 font-inter text-[15.5px] leading-[1.6] text-ndm-ink/75">{d}</p>
                </div>
              </li>
            );
          })}
        </ol>
      </div>
    </section>
  );
}

/* a closed treatment row shows one offer line, built only from the site's own badges */
function bestOffer(opts) {
  const tags = opts.map((o) => o[3]).filter(Boolean);
  if (!tags.length) return '';
  const pct = Math.max(0, ...tags.map((t) => { const m = /^(\d+)% OFF$/i.exec(t); return m ? +m[1] : 0; }));
  return pct ? `Up to ${pct}% off` : tags[0];
}
const perUnit = (cat, label) => (cat.unit && label === 'Regular' ? ' / unit' : '');
