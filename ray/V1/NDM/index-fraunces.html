<style>
  :root{
    --e-inout:cubic-bezier(.87,0,.13,1);
    --e-out:cubic-bezier(.16,1,.3,1);
    --e-quart:cubic-bezier(.165,.84,.44,1);
    --gx:clamp(20px, 5vw, 96px);
    --pad:var(--gx);
    --hpad:var(--gx);
  }
  html,body{-webkit-text-size-adjust:100%;overflow-x:clip}
  html.lenis, html.lenis body{height:auto}
  .lenis.lenis-smooth{scroll-behavior:auto !important}
  .lenis.lenis-stopped{overflow:hidden}
  body{margin:0;background:#0B0F13;color:#1B242B;font-family:Manrope,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
  #root{background:#FAF8F4}
  :focus-visible{outline:2px solid #26B1E7;outline-offset:3px;border-radius:6px}
  .no-scrollbar{scrollbar-width:none}.no-scrollbar::-webkit-scrollbar{display:none}

  /* hero */
  .slide{visibility:hidden}
  .slide.is-on{visibility:visible}
  .line{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
  .is-intro .line{overflow:visible}
  .is-pre .line-in,.is-pre .fade,.is-pre .ui-fade{opacity:0}
  .is-pre .plate{clip-path:inset(100% 0 0 0)}
  .plate{position:absolute;inset:0;overflow:hidden;will-change:transform,clip-path}
  .plate .px{position:absolute;inset:-3%;transform:translate3d(calc(var(--mx,0) * -16px),calc(var(--my,0) * -10px),0);transition:transform .9s var(--e-out)}
  .plate img{width:100%;height:100%;object-fit:cover}
  .shade-x{background:linear-gradient(90deg,rgba(6,10,14,.78) 0%,rgba(6,10,14,.45) 42%,rgba(6,10,14,.12) 100%)}
  .shade-y{background:linear-gradient(0deg,rgba(6,10,14,.7) 0%,rgba(6,10,14,0) 46%),linear-gradient(180deg,rgba(6,10,14,.6) 0%,rgba(6,10,14,0) 24%)}
  .soft-blur{backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    -webkit-mask-image:radial-gradient(115% 95% at 72% 28%,transparent 46%,#000 86%);
            mask-image:radial-gradient(115% 95% at 72% 28%,transparent 46%,#000 86%)}

  /* header */
  .hdr-bar{transition:max-width .7s var(--e-out),padding .7s var(--e-out),background-color .5s ease,box-shadow .5s ease,border-radius .7s var(--e-out),border-color .5s ease,margin .7s var(--e-out),color .4s ease}
  .panel{transition:clip-path .5s var(--e-out),opacity .25s ease,visibility 0s linear .5s}
  .panel[data-open="false"]{opacity:0;clip-path:inset(0 0 100% 0 round 28px);visibility:hidden;pointer-events:none}
  .panel[data-open="true"]{opacity:1;clip-path:inset(0 0 0 0 round 28px);visibility:visible;transition:clip-path .55s var(--e-out),opacity .2s ease,visibility 0s}
  .panel>div{transition:opacity .4s ease .1s,transform .55s var(--e-out) .1s}
  .panel[data-open="false"]>div{opacity:0;transform:translateY(12px)}
  .menu-scrim{transition:opacity .45s ease,visibility 0s linear .45s}
  .menu-scrim[data-open="true"]{transition:opacity .45s ease,visibility 0s}
  /* buttons. Book Free Consultation (.btn-book) is the one signature button: amber pill, white arrow dot,
     a deep-blue fill grows out of the dot on hover. It looks identical everywhere, header included.
     Every other button is a plain pill with no icon: ink (dark), line (outline), light (on photos), glass (on dark panels). */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:1px solid transparent;
    font:500 15px/1 Manrope,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em;white-space:nowrap;-webkit-tap-highlight-color:transparent;
    transition:background-color .3s ease,color .3s ease,border-color .3s ease,transform .2s ease}
  .btn:active{transform:scale(.98)}
  .btn>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .btn-sm{height:40px;padding:0 18px;font-size:14px}
  .btn-block{display:flex;width:100%}
  .btn-ink{background:#1B242B;color:#fff}
  .btn-ink:hover,.btn-ink:focus-visible,.group:hover .btn-g.btn-ink{background:#0F80C3}
  .btn-line{background:transparent;color:#1B242B;border-color:rgba(27,36,43,.18)}
  .btn-line:hover,.btn-line:focus-visible,.group:hover .btn-g.btn-line{background:#1B242B;border-color:#1B242B;color:#fff}
  .btn-light{background:#fff;color:#1B242B}
  .btn-light:hover,.btn-light:focus-visible,.group:hover .btn-g.btn-light{background:#1B242B;color:#fff}
  .btn-glass{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .btn-glass:hover,.btn-glass:focus-visible{background:#fff;border-color:#fff;color:#1B242B}
  .btn-book{position:relative;isolation:isolate;overflow:hidden;justify-content:space-between;gap:12px;padding:0 6px 0 22px;background:#FFA617;color:#fff;
    box-shadow:0 12px 28px -12px rgba(255,166,23,.9)}
  .btn-book::before{content:"";position:absolute;z-index:-1;right:6px;top:50%;width:36px;height:36px;border-radius:999px;background:#0F80C3;transform:translateY(-50%) scale(0);transition:transform .6s var(--e-out)}
  .btn-book:hover::before,.btn-book:focus-visible::before,.group:hover .btn-g.btn-book::before{transform:translateY(-50%) scale(22)}
  .btn-dot{display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;border-radius:999px;background:#fff;color:#FFA617;transition:transform .5s var(--e-out),color .4s ease}
  .btn-book:hover .btn-dot,.btn-book:focus-visible .btn-dot,.group:hover .btn-g .btn-dot{transform:rotate(-45deg);color:#0F80C3}

  /* appear on scroll */
  .rv{opacity:0;transform:translate3d(0,28px,0);filter:blur(8px);transition:opacity .9s var(--e-out),transform 1.1s var(--e-out),filter .9s var(--e-out)}
  .rv.in{opacity:1;transform:none;filter:none}

  .price-swap{animation:priceIn .55s var(--e-out) both}
  @keyframes priceIn{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
  .card-in{animation:cardIn .8s var(--e-out) both}
  @keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
  .space-in{animation:priceIn .7s var(--e-out) both}

  .ind-run{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-dasharray:.16 .84;stroke-dashoffset:.16;opacity:0;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px rgba(124,182,255,.9));animation:indRun 3.2s cubic-bezier(.45,0,.25,1) infinite}
  @keyframes indRun{0%{stroke-dashoffset:.16;opacity:0}8%{opacity:1}78%{opacity:1}100%{stroke-dashoffset:-.86;opacity:0}}
  .ind-o{fill:#fff;filter:drop-shadow(0 0 6px #fff)}
  .ind-o2{fill:none;stroke:#fff;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:indPing 2.4s ease-out infinite}
  @keyframes indPing{0%{transform:scale(1);opacity:.9}100%{transform:scale(4.2);opacity:0}}
  .namica-cap{transform-box:fill-box;transform-origin:center;animation:capPulse 2.6s ease-in-out infinite}
  @keyframes capPulse{0%,100%{transform:scale(.6);opacity:.25}50%{transform:scale(1.25);opacity:.9}}
  .promo-card{background:radial-gradient(420px circle at var(--gx,50%) var(--gy,0%),rgba(38,177,231,.16),transparent 45%),linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02))}

  .space-reveal{animation:spaceReveal 1.15s var(--e-inout) both}
  @keyframes spaceReveal{from{clip-path:inset(100% 0 0 0);transform:scale(1.12)}to{clip-path:inset(0 0 0 0);transform:scale(1)}}
  .space-sweep{background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.22) 45%,rgba(255,255,255,.22) 55%,rgba(255,255,255,0));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:spaceSweep 1.15s var(--e-inout) both}
  @keyframes spaceSweep{0%{clip-path:inset(0 0 100% 0);opacity:1}45%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 0);opacity:0}}
  .space-num{opacity:0;animation:spaceNum 1.3s var(--e-out) both;text-shadow:0 20px 60px rgba(0,0,0,.25)}
  @keyframes spaceNum{0%{opacity:0;transform:translateY(40px);filter:blur(10px)}35%{opacity:.95;transform:none;filter:none}70%{opacity:.95}100%{opacity:0;transform:translateY(-20px);filter:blur(6px)}}

  /* clip reveal (photos) */
  .rv.rv-clip{opacity:1;filter:none;clip-path:inset(100% 0 0 0);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:clip-path 1.3s var(--e-inout),transform .6s var(--e-out)}
  .rv.rv-clip.in{clip-path:inset(0 0 0 0);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
  /* specials */
  @property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
  .specials-grid{background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:72px 72px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 25% 20%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 25% 20%,#000 10%,transparent 75%)}
  .specials-gradient{background:linear-gradient(90deg,#fff 0%,#8FD6F5 55%,#FFC46B 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .specials-price{background:linear-gradient(180deg,#fff 35%,rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;color:transparent}
  .ticket{transition:transform .6s var(--e-out)}
  .ticket:hover{transform:translateY(-8px)}
  .ticket-ring{background:conic-gradient(from var(--ang),rgba(255,255,255,.1) 0deg,rgba(255,255,255,.1) 200deg,rgba(38,177,231,.95) 250deg,rgba(255,166,23,.85) 290deg,rgba(255,255,255,.1) 330deg);opacity:.5;animation:ringSpin 6s linear infinite;transition:opacity .5s ease}
  .ticket:hover .ticket-ring{opacity:1;animation-duration:3s}
  @keyframes ringSpin{to{--ang:360deg}}
  .ticket-body{background:radial-gradient(380px circle at var(--gx2,50%) var(--gy2,0%),rgba(38,177,231,.18),transparent 55%),linear-gradient(165deg,#151C22 0%,#0E1418 100%)}
  .ticket-featured{background:radial-gradient(460px circle at var(--gx2,30%) var(--gy2,0%),rgba(255,166,23,.24),transparent 55%),radial-gradient(500px circle at 100% 100%,rgba(38,177,231,.18),transparent 60%),linear-gradient(165deg,#1A2128 0%,#0F151A 100%)}
  .ticket-perf{margin:4px 22px;border-top:1px dashed rgba(255,255,255,.18)}
  .ticket-perf::before,.ticket-perf::after{content:"";position:absolute;top:-12px;width:24px;height:24px;border-radius:50%;background:#0B0F13}
  .ticket-perf::before{left:-35px}.ticket-perf::after{right:-35px}

  /* specials wheel (Orveli layout), light */
  .specials-wheel{--sw-panel:#EEF4F8;--sw-ink:#1B242B;--sw-muted:#5A646C;--sw-line:#E3E9EF;--sw-ctrl:rgba(27,36,43,.18);--sw-view:rgba(27,36,43,.06)}
  .sw-panel{background:var(--sw-panel);color:var(--sw-ink)}
  .sw-title{color:#1B242B}
  .sw-muted{color:var(--sw-muted)}
  .sw-stage{-webkit-mask-image:linear-gradient(180deg,#000 86%,transparent 100%);mask-image:linear-gradient(180deg,#000 86%,transparent 100%)}
  .sw-card{overflow:hidden;background:linear-gradient(180deg,#F4F9FD 0%,#fff 58%);border:1px solid var(--sw-line);box-shadow:0 26px 50px -30px rgba(15,60,95,.3);color:var(--sw-ink);transform-origin:50% 50%;transition:transform .9s var(--e-out),opacity .6s ease,border-color .5s ease,box-shadow .6s ease,background .6s ease}
  .sw-card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#0F80C3,#26B1E7);transform:scaleX(0);transform-origin:left;transition:transform .9s var(--e-out)}
  .sw-card.is-on{background:linear-gradient(180deg,#E6F3FB 0%,#fff 62%);border-color:rgba(32,158,217,.5);box-shadow:0 44px 70px -34px rgba(15,128,195,.45),0 0 0 5px rgba(32,158,217,.1)}
  .sw-card.is-on::before{transform:none}
  .sw-card:not(.is-on):hover{border-color:rgba(32,158,217,.35)}
  .sw-ring{border:1px solid rgba(32,158,217,.13)}
  .sw-badge{background:rgba(32,158,217,.1);color:#0F80C3;transition:background .5s ease,color .5s ease}
  .sw-card.is-on .sw-badge{background:#209ED9;color:#fff}
  .sw-tag{border:1px solid rgba(15,128,195,.2);color:#0F80C3}
  .sw-tag.is-feature{background:#FFA617;border-color:#FFA617;color:#fff}
  .sw-price{color:#0F80C3;padding-bottom:.06em}
  .sw-cur{display:inline-block;font-size:.42em;vertical-align:top;margin:.2em .08em 0 0;letter-spacing:0;color:#0F80C3}

  .sw-ctrl:hover{background:var(--sw-ink);color:var(--sw-panel)}
  .sw-dot{background:var(--sw-ctrl)}
  .sw-dot.is-on{background:#FFA617}
  /* first-visit offer popup */
  .offer-badge{animation:offerSpin 22s linear infinite}
  @keyframes offerSpin{to{transform:rotate(360deg)}}
  .offer-scrim{background:rgba(11,15,19,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .45s ease}
  .offer-card{opacity:0;transform:translateY(100%);transition:transform .7s var(--e-out),opacity .35s ease}
  @media (min-width:640px){.offer-card{transform:translateY(40px) scale(.97)}}
  .offer-pop-root.is-open .offer-scrim{opacity:1}
  .offer-pop-root.is-open .offer-card{opacity:1;transform:none}
  .offer-pic{transform:scale(1.18);transition:transform 1.8s var(--e-out)}
  .offer-pop-root.is-open .offer-pic{transform:scale(1.03)}
  .offer-in{opacity:0;transform:translateY(16px);transition:opacity .6s var(--e-out) var(--d,0s),transform .8s var(--e-out) var(--d,0s)}
  .offer-pop-root.is-open .offer-in{opacity:1;transform:none}
  /* approach + process */

    { k: 'visia', node: <a href="#/book" className="hover:underline">Free VISIA® skin analysis, <span className="font-medium">book →</span></a> },

  ];
  const [i, setI] = useState(0);
  const [paused, setPaused] = useState(false);
  const n = msgs.length;
  useEffect(() => { setI((v) => v % n); }, [n]);
  useEffect(() => {
    if (paused || REDUCED) return;
    const t = setInterval(() => setI((v) => (v + 1) % n), 4800);
    return () => clearInterval(t);
  }, [paused, n]);

  return (
    <div
      role="region" aria-label="Clinic announcements"
      className={`promo-attn fixed inset-x-0 top-0 z-[60] h-9 overflow-hidden text-white font-mont text-[12.5px] sm:text-[13px] ${hidden ? '-translate-y-full' : 'translate-y-0'}`}

      <span aria-hidden="true" className="promo-shine pointer-events-none absolute inset-0" />
      <div className="relative h-full grid grid-cols-[auto_1fr_auto] lg:grid-cols-[1fr_minmax(0,620px)_1fr] items-center gap-2 px-2 lg:px-[var(--hpad)]">

            <a key={p.num} href={tel(p.num)} className="hover:underline underline-offset-4">
              <span className="opacity-75">{p.label}</span> <span className="font-medium">{p.num}</span>
            </a>
          ))}
        </div>
        <div className="flex items-center justify-center gap-1 min-w-0 col-span-3 lg:col-span-1">
          <span className="promo-new relative hidden shrink-0 items-center gap-1.5 rounded-full bg-white px-2 py-[3px] font-mont text-[10px] font-semibold uppercase tracking-[.12em] text-ndm-deep sm:inline-flex">
            <i className="promo-ping relative size-1.5 rounded-full bg-ndm-amber" />New
          </span>
          <div className="relative h-9 flex-1 overflow-hidden" aria-live="off">
            {msgs.map((m, k) => {
              const d = (k - i + n) % n;
              const state = d === 0 ? 'on' : d === 1 ? 'next' : 'prev';
              return (
                <div key={m.k} aria-hidden={state !== 'on'}
                  className="absolute inset-0 flex items-center justify-center text-center whitespace-nowrap overflow-hidden text-ellipsis px-1"
                  style={{
                    transform: state === 'on' ? 'translateY(0)' : state === 'next' ? 'translateY(100%)' : 'translateY(-100%)',
                    opacity: state === 'on' ? 1 : 0,
                    transition: 'transform .7s var(--e-out), opacity .5s ease',
                    pointerEvents: state === 'on' ? 'auto' : 'none',
                  }}
                  {...(state !== 'on' ? { inert: '' } : {})}
                ><span className="truncate">{m.node}</span></div>
              );
            })}
          </div>
        </div>
        <div className="hidden lg:flex justify-end">
          <a href="shop.html" target="_blank" rel="noopener" className="inline-flex items-center gap-1.5 font-medium hover:underline underline-offset-4">Shop skincare <IconExternal /></a>
        </div>
      </div>
    </div>
  );
}

function Header({ dark, top, visible, onSearch, onDrawer }) {
  const [open, setOpen] = useState(null);
  const timer = useRef(0);
  const wrapRef = useRef(null);
  const enter = (id) => { clearTimeout(timer.current); setOpen(id); };
  const leave = () => { clearTimeout(timer.current); timer.current = setTimeout(() => setOpen(null), 160); };
  useEffect(() => {
    const k = (e) => { if (e.key === 'Escape') setOpen(null); };
    const c = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(null); };
    window.addEventListener('keydown', k); document.addEventListener('pointerdown', c);
    return () => { window.removeEventListener('keydown', k); document.removeEventListener('pointerdown', c); };
  }, []);
  const tone = dark && !open; /* the bar turns solid white while a mega menu is open */
  const hover = tone ? 'hover:bg-white/10' : 'hover:bg-black/5';
  const active = tone ? 'bg-white/10' : 'bg-black/5';
  const icon = `grid place-items-center size-10 rounded-[8px] transition-colors ${hover}`;

  return (

      style={{

        style={{ background: 'rgba(11,15,19,.42)', backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)', opacity: open ? 1 : 0, visibility: open ? 'visible' : 'hidden' }} />

/* ---------------------------------------------------------------- hero (3 scenes, bottom-to-top) */
function Hero({ sectionRef, onIntroDone }) {
  const stageRef = useRef(null);
  const uiRef = useRef(null);
  const slideEls = useRef([]);
  const cur = useRef(0);
  const busy = useRef(false);
  const pending = useRef(null);
  const ready = useRef(false);
  const [active, setActive] = useState(0);
  const [pre, setPre] = useState(!REDUCED);

  const parts = (k) => {
    const root = slideEls.current[k];
    return {
      root,
      plate: root.querySelector('.plate'),
      img: root.querySelector('.plate img'),
      hl: root.querySelector('.hl'),
      lines: [...root.querySelectorAll('.line-in')],
      fades: [...root.querySelectorAll('.fade')],
    };
  };

  /* first load, Essentia-style: headline blurs in at centre, settles, then the plate rises from below */
  useLayoutEffect(() => {
    if (REDUCED) { onIntroDone(); ready.current = true; return; }
    lockScroll(true);
    window.scrollTo(0, 0);
    let killed = false;
    const anims = [];
    const go = () => {
      if (killed) return;
      const s = parts(0);
      const a = (el, kf, o) => { const x = el.animate(kf, { fill: 'both', ...o }); anims.push(x); return x; };
      const r = s.hl.getBoundingClientRect();
      const off = window.innerHeight / 2 - (r.top + r.height / 2);
      stageRef.current.classList.add('is-intro');
      s.lines.forEach((l, i) => a(l, [
        { opacity: 0, filter: 'blur(18px)', transform: 'translateY(35%)' },
        { opacity: 1, filter: 'blur(0px)', transform: 'translateY(0)' },
      ], { duration: 1000, delay: 120 + i * 150, easing: E.out }));
      a(s.hl, [{ transform: `translate3d(0,${off}px,0)` }, { transform: 'translate3d(0,0,0)' }], { duration: 1400, delay: 1150, easing: E.inout });
      a(s.plate, [{ clipPath: 'inset(100% 0 0 0)' }, { clipPath: 'inset(0% 0 0 0)' }], { duration: 1500, delay: 1000, easing: E.inout });
      a(s.img, [{ transform: 'scale(1.28) translateY(6%)' }, { transform: 'scale(1) translateY(0)' }], { duration: 2400, delay: 1000, easing: E.out });
      s.fades.forEach((f, i) => a(f, [
        { opacity: 0, transform: f.dataset.badge ? 'scale(.82) rotate(-24deg)' : 'translateY(18px)' },
        { opacity: 1, transform: 'none' },
      ], { duration: 900, delay: 2050 + i * 110, easing: E.quart }));
      a(uiRef.current, [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 900, delay: 2350, easing: E.quart });
      setPre(false);
      setTimeout(() => { if (!killed) onIntroDone(); }, 1900);
      setTimeout(() => {
        if (killed) return;
        anims.forEach((x) => x.cancel());
        stageRef.current.classList.remove('is-intro');
        lockScroll(false);
        ready.current = true;
        window.dispatchEvent(new Event('scroll'));
      }, 3300);
    };
    const fontsOk = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 900))]) : Promise.resolve();
    fontsOk.then(() => requestAnimationFrame(go));
    return () => { killed = true; anims.forEach((x) => x.cancel()); lockScroll(false); };
  }, []);

  /* scene change, incoming plate wipes in from the bottom, outgoing plate drifts up */
  const go = useCallback((to) => {
    const from = cur.current;
    if (to === from) return;
    if (busy.current) { pending.current = to; return; }
    const out = parts(from), inn = parts(to), dir = to > from ? 1 : -1;
    cur.current = to; setActive(to);
    inn.root.classList.add('is-on'); inn.root.style.zIndex = 2; out.root.style.zIndex = 1;
    if (REDUCED) { out.root.classList.remove('is-on'); return; }
    busy.current = true;
    const anims = [];
    const a = (el, kf, o) => anims.push(el.animate(kf, { fill: 'both', ...o }));
    out.lines.forEach((l, i) => a(l, [{ transform: 'translateY(0)' }, { transform: `translateY(${-110 * dir}%)` }], { duration: 520, delay: i * 50, easing: E.in3 }));
    out.fades.forEach((f) => a(f, [{ opacity: 1 }, { opacity: 0 }], { duration: 360, easing: E.in3 }));
    a(out.plate, [{ transform: 'translate3d(0,0,0) scale(1)' }, { transform: `translate3d(0,${-dir * 24}vh,0) scale(1.06)` }], { duration: 1250, delay: 80, easing: E.inout });
    a(inn.plate, [
      { clipPath: dir > 0 ? 'inset(100% 0 0 0)' : 'inset(0 0 100% 0)', transform: `translate3d(0,${dir * 30}vh,0)` },
      { clipPath: 'inset(0% 0 0 0)', transform: 'translate3d(0,0,0)' },
    ], { duration: 1250, delay: 80, easing: E.inout });
    a(inn.img, [{ transform: 'scale(1.2)' }, { transform: 'scale(1)' }], { duration: 1800, delay: 80, easing: E.out });
    inn.lines.forEach((l, i) => a(l, [{ transform: `translateY(${110 * dir}%)` }, { transform: 'translateY(0)' }], { duration: 1000, delay: 700 + i * 90, easing: E.quart }));
    inn.fades.forEach((f, i) => a(f, [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], { duration: 700, delay: 950 + i * 80, easing: E.quart }));
    setTimeout(() => {
      out.root.classList.remove('is-on');
      anims.forEach((x) => x.cancel());
      busy.current = false;
      const p = pending.current; pending.current = null;
      if (p != null && p !== cur.current) go(p);
    }, 1500);
  }, []);

  /* scroll position inside the 300vh section picks the scene */
  useOnScroll(() => {
    if (!ready.current || !sectionRef.current) return;
    const vh = window.innerHeight;
    const s = -sectionRef.current.getBoundingClientRect().top;
    const idx = s < 0.55 * vh ? 0 : s < 1.35 * vh ? 1 : 2;
    if (idx !== cur.current || busy.current) go(idx);
  }, []);

  const jump = (k) => {
    const top = sectionRef.current.getBoundingClientRect().top + window.scrollY;
    scrollToY(top + [0, 0.95, 1.75][k] * window.innerHeight);
  };
  const next = () => {
    if (active < 2) return jump(active + 1);
    const r = sectionRef.current.getBoundingClientRect();
    scrollToY(r.bottom + window.scrollY);
  };
  const prev = () => active > 0 && jump(active - 1);

  const onMove = (e) => {
    if (REDUCED) return;
    const el = stageRef.current;
    el.style.setProperty('--mx', (e.clientX / window.innerWidth - 0.5).toFixed(3));
    el.style.setProperty('--my', (e.clientY / window.innerHeight - 0.5).toFixed(3));
  };

  return (
    <section ref={sectionRef} id="top" data-nav="dark" aria-label="Welcome to NewDermaMed" className="relative h-[300vh] bg-ndm-night">
      <div ref={stageRef} onPointerMove={onMove} className={`sticky top-0 h-[100svh] overflow-hidden text-white ${pre ? 'is-pre' : ''}`}>
        {SLIDES.map((s, k) => {
          const H = k === 0 ? 'h1' : 'h2';
          return (
            <div key={k} ref={(el) => (slideEls.current[k] = el)} className={`slide absolute inset-0 ${k === 0 ? 'is-on' : ''}`} aria-hidden={active !== k} {...(active !== k ? { inert: '' } : {})}>
              <div className="plate">
                <div className="px">
                  <img src={s.img.src} alt={s.img.alt}
                    style={{ objectPosition: s.img.pos, scale: String(s.img.scale) }} fetchpriority={k === 0 ? 'high' : 'auto'} />
                </div>
                {s.img.dim && <div className="absolute inset-0" style={{ background: `rgba(6,10,14,${s.img.dim})` }} />}
                <div className="absolute inset-0 soft-blur" />
                <div className="absolute inset-0 shade-x" />
                <div className="absolute inset-0 shade-y" />
              </div>

              <div className="absolute inset-x-0 bottom-[clamp(132px,19vh,230px)] md:bottom-[clamp(84px,15vh,230px)] px-[var(--pad)]">
                <div className="max-w-[760px]">
                  {s.badge && (
                    <img src="assets/icons/16-years.svg" alt="NewDermaMed Laser Clinic, 16 years" data-badge="1"
                      className="fade mb-3 md:mb-4 w-[clamp(84px,7.3vw,140px)] h-auto" />
                  )}
                  <div className="hl">
                    <H className="font-aeonik font-normal text-[clamp(25px,2.5vw+4px,56px)] leading-[1.22] tracking-[-0.01em] [text-shadow:0_20px_35px_rgba(0,0,0,.15)]">
                      {s.lines.map((l, i) => <span key={i} className="line"><span className="line-in block">{l}</span></span>)}
                    </H>
                  </div>
                  <p className="fade mt-3 md:mt-[10px] max-w-[611px] font-inter text-[clamp(15px,1.05vw+4px,24px)] leading-[1.45] text-white/90">{s.sub}</p>
                  <div className="fade mt-6 md:mt-5">
                    <Btn href={s.href} v={/book/i.test(s.cta) ? 'book' : 'light'}>{s.cta}</Btn>
                  </div>
                </div>
              </div>
            </div>
          );
        })}

        {/* scene navigation */}
        <div ref={uiRef} className="ui-fade absolute z-10 right-[var(--pad)] left-[var(--pad)] md:left-auto bottom-6 md:bottom-[clamp(84px,15vh,230px)] flex items-center justify-between md:justify-end">
          <div className="hidden lg:flex items-center">
            {SLIDES.map((s, k) => (
              <Fragment key={k}>
                <button onClick={() => jump(k)} aria-current={active === k ? 'step' : undefined} className="group relative w-[clamp(170px,11.5vw,220px)] text-center py-1">
                  <span className={`block font-inter font-medium text-[15px] capitalize transition-colors duration-500 ${active === k ? 'text-white' : 'text-white/55 group-hover:text-white/85'}`}>{s.tab[0]}</span>
                  <span className="block mt-2.5 font-inter text-[13px] text-ndm-soft">{s.tab[1]}</span>
                  <span className={`absolute left-1/2 -bottom-3 h-px w-12 -translate-x-1/2 origin-left bg-white transition-transform duration-700 ${active === k ? 'scale-x-100' : 'scale-x-0'}`} />
                </button>
                {k < SLIDES.length - 1 && <span className="h-[50px] w-px bg-[#B9B9B9]/60" aria-hidden="true" />}
              </Fragment>
            ))}
          </div>
          <div className="flex lg:hidden items-center gap-2" aria-hidden="true">
            {SLIDES.map((_, k) => <span key={k} className="relative h-[2px] w-9 overflow-hidden rounded bg-white/25"><span className={`absolute inset-0 bg-white origin-left transition-transform duration-700 ${active === k ? 'scale-x-100' : 'scale-x-0'}`} /></span>)}
          </div>
          <div className="flex items-center gap-2.5 lg:ml-3">
            <button onClick={prev} disabled={active === 0} aria-label="Previous scene" className="grid place-items-center size-[48px] md:size-[55px] rounded-full border border-white/25 text-white transition hover:bg-white hover:text-ndm-ink disabled:opacity-35 disabled:hover:bg-transparent disabled:hover:text-white"><IconCaret up /></button>
            <button onClick={next} aria-label={active === 2 ? 'Continue to page' : 'Next scene'} className="grid place-items-center size-[48px] md:size-[55px] rounded-full border border-white/25 text-white transition hover:bg-white hover:text-ndm-ink"><IconCaret /></button>
          </div>
        </div>
        <p className="sr-only" aria-live="polite">Scene {active + 1} of 3: {SLIDES[active].lines.join(' ')}</p>
      </div>
    </section>
  );

/* process (Skinlycare "Process", r12): header row on top, then the photo beside three step cards of equal height.
   Each card lights up when its top crosses the focus line (70% of the viewport); the thin bar on the current card fills until the next one lights up. */
function Process() {
  const ref = useRef(null), list = useRef(null), pic = useRef(null), img = useRef(null);
  const items = useRef([]), cards = useRef([]), bars = useRef([]);
  useReveal(ref);
  useOnScroll(() => {
    const l = list.current; if (!l) return;
    const vh = window.innerHeight, focus = vh * 0.7, top = l.getBoundingClientRect().top, n = PROCESS.length;
    /* read first (offsetTop ignores the .rv rise transform), then write */
    const pos = PROCESS.map((_, i) => { const li = items.current[i]; return li ? [li.offsetTop, li.offsetHeight] : [0, 0]; });
    const q = !REDUCED && pic.current ? pic.current.getBoundingClientRect() : null;
    pos.forEach(([o, h], i) => {
      const c = cards.current[i]; if (!c) return;
      const y = focus - (top + o);

      c.classList.toggle('is-on', REDUCED || y >= 0);
      const b = bars.current[i];

      const p = clamp01((vh - q.top) / (vh + q.height));

/* ---------------------------------------------------------------- appear-on-scroll (Essentia-style blur + rise) */
function useReveal(ref) {
  useEffect(() => {
    const root = ref.current; if (!root) return;
    const els = root.querySelectorAll('.rv');
    if (REDUCED || !('IntersectionObserver' in window)) { els.forEach((e) => e.classList.add('in')); return; }
    const io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { rootMargin: '0px 0px -10% 0px' });
    els.forEach((e) => io.observe(e));
    return () => io.disconnect();
  }, []);
}

/* arc positions measured from the Orveli "New arrivals" wheel (card 312 × 430): x, y drop, rotation per step */
const ARC = [[0, 0, 0], [359, 26, 8.77], [711, 113, 18.83], [1033, 243, 25.05], [1320, 400, 31]];
const arcAt = (d) => {
  const a = Math.min(Math.abs(d), ARC.length - 1), i = Math.floor(a), f = a - i;
  const p = ARC[i], q = ARC[Math.min(i + 1, ARC.length - 1)];
  const s = Math.sign(d) || 1;
  return [s * (p[0] + (q[0] - p[0]) * f), p[1] + (q[1] - p[1]) * f, s * (p[2] + (q[2] - p[2]) * f)];
};

function useInView(ref, opts = { threshold: 0.35 }) {
  const [v, setV] = useState(REDUCED);
  useEffect(() => {
    const el = ref.current; if (!el || REDUCED) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); io.disconnect(); } }, opts);
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return v;
}
function CountUp({ to, run, suffix = '' }) {
  const [n, setN] = useState(REDUCED ? to : 0);
  useEffect(() => {
    if (!run || REDUCED) return;
    let raf, t0;
    const tick = (t) => { if (!t0) t0 = t; const p = Math.min(1, (t - t0) / 1600); setN(Math.round(to * easeOut(p))); if (p < 1) raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [run]);
  return <>{n}{suffix}</>;
}

/* one-time "you can drag this" hint: 50 -> 34 -> 66 -> 50 over 1.6s, each leg eased with the page's easeInOut */
const BA_HINT_MS = 1600;
const BA_HINT = [[0, 50], [0.3, 34], [0.72, 66], [1, 50]];
const baHintAt = (p) => {
  for (let k = 1; k < BA_HINT.length; k++) {
    const [p0, v0] = BA_HINT[k - 1], [p1, v1] = BA_HINT[k];
    if (p <= p1) return v0 + (v1 - v0) * easeInOut((p - p0) / (p1 - p0));
  }
  return 50;
};

);
const BaIconDrag = (p) => (
  <Svg size={18} vb="0 0 20 20" {...p}><path d="M7.5 6 3.5 10l4 4M12.5 6l4 4-4 4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" /></Svg>
);

/* compare slider: AFTER photo underneath, BEFORE photo on top, clipped to the left of the divider.
   Mouse and pen grab at once (click to jump, drag to slide). Touch waits for a sideways move or a tap,
   so a vertical swipe over a photo still scrolls the page. Keyboard and screen readers use the native range input. */
function BaCompare({ c, i, nudge = true }) {
  const box = useRef(null), drag = useRef(null), touched = useRef(false), hint = useRef(0);
  const [pos, setPos] = useState(50);
  const [active, setActive] = useState(false); /* a pointer is sliding: the handle grows */
  const [tween, setTween] = useState(false); /* a discrete jump (click, tap, keys): ease into place */
  const seen = useInView(box, { threshold: 0.5 });

  const stopHint = () => { touched.current = true; cancelAnimationFrame(hint.current); };
  const fromX = (x) => {
    const r = box.current.getBoundingClientRect();
    return r.width ? 100 * clamp01((x - r.left) / r.width) : 50;
  };
  const jump = (v) => { stopHint(); setTween(true); setPos(v); };
  const slide = (v) => { setTween(false); setPos(v); };

  useEffect(() => {
    if (!seen || !nudge || REDUCED || touched.current) return;
    let t0 = 0;
    const tick = (t) => {
      if (touched.current) return;
      if (!t0) t0 = t;
      const p = Math.min(1, (t - t0) / BA_HINT_MS);
      slide(baHintAt(p));
      if (p < 1) hint.current = requestAnimationFrame(tick);
    };
    const wait = setTimeout(() => { hint.current = requestAnimationFrame(tick); }, 350 + 150 * i);
    return () => { clearTimeout(wait); cancelAnimationFrame(hint.current); };
  }, [seen]);

  const grab = (e) => {
    try { box.current.setPointerCapture(e.pointerId); } catch (err) { /* pointer already released */ }
    setActive(true);
    jump(fromX(e.clientX));
  };
  const down = (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.pointerType === 'touch' && drag.current && drag.current.on) return; /* a second finger while sliding */
    const now = e.pointerType !== 'touch';
    drag.current = { id: e.pointerId, x: e.clientX, y: e.clientY, on: now };
    if (now) { e.preventDefault(); grab(e); }
  };
  const move = (e) => {
    const d = drag.current; if (!d || d.id !== e.pointerId) return;
    if (!d.on) {
      const dx = Math.abs(e.clientX - d.x), dy = Math.abs(e.clientY - d.y);
      if (dx < 6 || dx <= dy) return;
      d.on = true; grab(e); return;
    }
    slide(fromX(e.clientX));
  };
  const end = (e) => {
    const d = drag.current; if (!d || d.id !== e.pointerId) return;
    drag.current = null;
    if (d.on) { setActive(false); return; }
    if (e.type === 'pointerup' && Math.abs(e.clientX - d.x) < 10 && Math.abs(e.clientY - d.y) < 10) jump(fromX(e.clientX)); /* a tap */
  };
  const lost = (e) => {
    const d = drag.current;
    if (d && d.on && d.id === e.pointerId) { drag.current = null; setActive(false); }
  };
  const key = (e) => {
    const k = e.key;
    const dir = k === 'ArrowLeft' || k === 'ArrowDown' ? -1 : k === 'ArrowRight' || k === 'ArrowUp' ? 1 : 0;
    if (!dir) return; /* Home, End, PageUp and PageDown stay native and arrive through onChange */
    e.preventDefault();
    jump(Math.min(100, Math.max(0, Math.round(pos) + dir * (e.shiftKey ? 10 : 2))));
  };
  const change = (e) => jump(Number(e.target.value));

  const clip = `inset(0 ${(100 - pos).toFixed(3)}% 0 0)`;
  const at = `${pos.toFixed(3)}%`;
  const shown = Math.round(pos);
  const img = 'absolute inset-0 h-full w-full object-cover';
  /* the source photos carry their own Before/After tags in the top corners (about 157x80 of 750x690):
     zooming 1.16x from the bottom edge crops the top 14% so the tags never show; fx keeps each face in frame */
  const crop = { objectPosition: `${c.fx}% 50%`, transformOrigin: `${c.fx}% 100%`, transform: 'scale(1.16)' };
  const pill = 'ba-pill absolute top-3 rounded-full pl-2.5 pr-2 py-[6px] font-inter text-[11.5px] font-medium uppercase leading-none tracking-[.14em] backdrop-blur-[8px]';
  const alt = (w) => `${w} Aptos thread lift, model ${c.n}, ${c.view.toLowerCase()}`;
  return (
    <div ref={box}
      className={`ba-box relative isolate aspect-[4/5] w-full cursor-ew-resize select-none overflow-hidden rounded-[22px] bg-ndm-ink/5 ring-1 ring-ndm-ink/[.06] focus-within:ring-2 focus-within:ring-ndm-blue focus-within:ring-offset-2 focus-within:ring-offset-ndm-paper${active ? ' is-drag' : ''}${tween ? ' is-tween' : ''}`}
      onPointerDown={down} onPointerMove={move} onPointerUp={end} onPointerCancel={end} onLostPointerCapture={lost}>
      <div className="ba-before absolute inset-0 z-[2]" style={{ clipPath: clip, WebkitClipPath: clip }}>
        <img src={c.before} alt={alt('Before')} width={750} height={690} loading="lazy" decoding="async" draggable={false} className={img} style={crop} />
        <span aria-hidden="true" className={`${pill} left-3 bg-ndm-ink/55 text-white`} style={{ opacity: pos < 12 ? 0 : 1 }}>Before</span>
      </div>
      <div className="absolute inset-0 z-[1]">
        <img src={c.after} alt={alt('After')} width={750} height={690} loading="lazy" decoding="async" draggable={false} className={img} style={crop} />
        <span aria-hidden="true" className={`${pill} right-3 bg-white/85 text-ndm-ink`} style={{ opacity: pos > 88 ? 0 : 1 }}>After</span>
      </div>
      <span aria-hidden="true" className="ba-line absolute inset-y-0 z-[3] w-px -translate-x-1/2 bg-white shadow-[0_0_12px_rgba(11,15,19,.35)]" style={{ left: at }} />
      <span aria-hidden="true" className="ba-handle absolute top-1/2 z-[4] grid size-10 place-items-center rounded-full bg-white text-ndm-ink shadow-[0_10px_24px_-10px_rgba(11,15,19,.55)] ring-1 ring-ndm-ink/10" style={{ left: at }}>
        <BaIconDrag />
      </span>
      <input type="range" min={0} max={100} step={0.5} value={Math.round(pos * 2) / 2}
        onChange={change} onKeyDown={key} onFocus={stopHint}
        aria-label={`Compare before and after, model ${c.n}`} aria-valuetext={`${shown}% before, ${100 - shown}% after`}
        className="absolute inset-0 z-20 m-0 h-full w-full appearance-none opacity-0" />
    </div>
  );
}

/* profile dialog: portalled to <body> so it sits above the fixed header; bottom sheet under 640px, centred card above */
function TeamProfile({ m, onClose }) {
  const [on, setOn] = useState(false);
  const box = useRef(null), closeBtn = useRef(null), leaving = useRef(false), timer = useRef(0);
  const close = useCallback(() => {
    if (leaving.current) return;
    leaving.current = true;
    setOn(false);
    timer.current = setTimeout(onClose, REDUCED ? 0 : 420);
  }, [onClose]);
  useEffect(() => {
    lockScroll(true);
    if (closeBtn.current) closeBtn.current.focus({ preventScroll: true });
    let r2 = 0;
    const r1 = requestAnimationFrame(() => { r2 = requestAnimationFrame(() => setOn(true)); });
    return () => { cancelAnimationFrame(r1); cancelAnimationFrame(r2); clearTimeout(timer.current); lockScroll(false); };
  }, []);
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') { close(); return; }
      if (e.key !== 'Tab' || !box.current) return;
      const f = box.current.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])');
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1], cur = document.activeElement;
      if (!box.current.contains(cur)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && cur === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && cur === last) { e.preventDefault(); first.focus(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [close]);

  return (
    <div className={`team-pop fixed inset-0 z-[85] flex items-end justify-center sm:items-center sm:p-6 ${on ? 'is-on' : ''}`}>
      <div aria-hidden="true" onClick={close} className="team-pop-scrim absolute inset-0" />
      <div ref={box} role="dialog" aria-modal="true" aria-labelledby="team-profile-title"
        className="team-pop-card relative w-full max-w-[880px] overflow-hidden rounded-t-[28px] bg-ndm-paper shadow-[0_40px_90px_-30px_rgba(11,15,19,.55)] sm:rounded-[28px]">
        <div data-lenis-prevent="" className="team-pop-scroll max-h-[90vh] overflow-y-auto overscroll-contain sm:max-h-[88vh]">
          {/* the close button lives inside the scroller (sticky, zero-height row) so arrow keys scroll the profile while it has focus */}
          <div className="pointer-events-none sticky top-0 z-10 flex h-0 justify-end">
            <button ref={closeBtn} type="button" onClick={close} aria-label="Close profile"
              className="pointer-events-auto mr-3 mt-3 grid size-10 shrink-0 place-items-center rounded-full bg-white/90 text-ndm-ink shadow-[0_8px_20px_-12px_rgba(11,15,19,.45)] transition-colors hover:bg-ndm-ink hover:text-white sm:mr-4 sm:mt-4">
              <IconClose size={18} />
            </button>
          </div>
          <span aria-hidden="true" className="mx-auto mt-3 block h-1 w-10 rounded-full bg-ndm-ink/15 sm:hidden" />
          <div className="grid gap-8 p-6 pt-5 pb-[max(28px,env(safe-area-inset-bottom))] sm:grid-cols-[220px_minmax(0,1fr)] sm:gap-9 sm:p-9 md:grid-cols-[248px_minmax(0,1fr)] md:gap-10 md:p-10">
            <aside className="hidden sm:block">
              <div className="team-pop-aside">
                <div className="relative aspect-[4/5] overflow-hidden rounded-[20px] bg-ndm-mist">
                  <img src={m.img} alt={`Portrait of ${m.name}`} width="272" height="444" className="absolute inset-0 h-full w-full object-cover object-[50%_15%]" />
                </div>
                <TeamFacts facts={m.facts} className="mt-6" />
              </div>
            </aside>
            <div className="min-w-0">
              <p className={`pr-12 ${TEAM_CRED}`}>{m.cred}</p>
              <div className="mt-3 flex items-center gap-4">
                <img src={m.img} alt="" width="272" height="444" className="aspect-[4/5] w-[72px] shrink-0 rounded-[14px] bg-ndm-mist object-cover object-[50%_15%] sm:hidden" />
                <div className="min-w-0">
                  <h2 id="team-profile-title" className="font-aeonik text-[clamp(28px,3.4vw,36px)] font-normal leading-[1.05] tracking-[-0.03em] text-ndm-ink">{m.name}</h2>
                  <p className="mt-2 font-inter text-[12px] font-[550] uppercase leading-[1.45] tracking-[.14em] text-ndm-deep">{m.role}</p>
                </div>
              </div>
              <div className="mt-6 space-y-4 font-inter text-[15px] leading-[1.65] text-ndm-muted">
                {m.bio.map((t, i) => <p key={i}>{t}</p>)}

function Space() {
  const track = useRef(null), stage = useRef(null), head = useRef(null), frame = useRef(null), ui = useRef(null);
  const layers = useRef([]), vids = useRef([]);
  const [idx, setIdx] = useState(0);
  useEffect(() => {
    const st = stage.current; if (!st) return;
    const io = new IntersectionObserver(([e]) => vids.current.forEach((v) => {
      if (!v) return;
      if (e.isIntersecting && !REDUCED) { const p = v.play(); if (p && p.catch) p.catch(() => {}); } else v.pause();
    }));
    io.observe(st);
    return () => io.disconnect();
  }, []);
  useOnScroll(() => {
    const el = track.current, f = frame.current, h = head.current; if (!el || !f || !h) return;
    const r = el.getBoundingClientRect(), vh = window.innerHeight, vw = window.innerWidth;
    const p = REDUCED ? 1 : clamp01(-r.top / Math.max(1, r.height - vh));
    /* phase 1 (0 to .3): grow from a card under the heading to the full screen */
    const g = easeInOut(clamp01(p / 0.3));
    const top0 = h.offsetTop + h.offsetHeight + 28;
    const w0 = vw < 768 ? vw * 0.84 : Math.min(600, Math.max(380, vw * 0.36));
    const s0 = Math.min(w0 / vw, Math.max(0.2, (vh - top0 - 24) / vh));
    const s = s0 + (1 - s0) * g;
    const dy = (top0 + (vh * s0) / 2 - vh / 2) * (1 - g);
    f.style.transform = `translate3d(0,${dy.toFixed(1)}px,0) scale(${s.toFixed(4)})`;
    f.style.borderRadius = `${((24 * (1 - g)) / s).toFixed(2)}px`;
    h.style.opacity = (1 - clamp01((g - 0.35) / 0.4)).toFixed(3);
    h.style.transform = `translate3d(0,${(-40 * g).toFixed(1)}px,0)`;
    if (ui.current) ui.current.style.opacity = clamp01((g - 0.8) / 0.2).toFixed(3);
    stage.current.dataset.nav = g > 0.92 ? 'dark' : '';
    /* phase 2 (.3 to 1): videos 2 and 3 slide in from the left, the outgoing one drifts right and dims */
    const q = SPACE.map((_, k) => (k === 0 ? 1 : easeInOut(clamp01((p - (0.32 + (k - 1) * 0.32)) / 0.26))));
    layers.current.forEach((l, k) => {
      if (!l) return;
      const out = k + 1 < q.length ? q[k + 1] : 0;
      l.style.transform = k === 0 ? `translate3d(${(out * 16).toFixed(2)}%,0,0)` : `translate3d(${((q[k] - 1) * 100 + out * 16).toFixed(2)}%,0,0)`;
      l.style.filter = `brightness(${(1 - out * 0.45).toFixed(3)})`;
    });
    setIdx(q.filter((v, k) => k > 0 && v >= 0.5).length);
  }, []);
  const glass = { background: 'rgba(11,15,19,.35)', backdropFilter: 'blur(22px)', WebkitBackdropFilter: 'blur(22px)' };
  const s = SPACE[idx];
  return (
    <section aria-labelledby="space" className="relative z-10 bg-ndm-paper">
      <div ref={track} className="relative" style={{ height: REDUCED ? '100vh' : '420vh' }}>
        <div ref={stage} className="sticky top-0 h-screen overflow-hidden">
          <div ref={head} className="absolute inset-x-0 top-[clamp(104px,14vh,150px)] px-[var(--gx)] text-center will-change-transform">
            <p className="inline-flex items-center gap-2 rounded-full border border-ndm-ink/10 bg-white/70 px-3.5 py-1.5 font-inter text-[13px] text-ndm-ink">
              <img src="assets/icons/logo-mark.svg" alt="" className="size-4" />The space
            </p>
            <TwoTone id="space" className="mx-auto mt-4" size="text-[clamp(32px,min(4.2vw,7vh),62px)]" lead={<>Step inside<br className="hidden sm:block" /></>} strong="NewDermaMed" />
            <p className="mx-auto mt-3 max-w-[52ch] font-inter text-[15px] leading-[1.55] text-ndm-muted">A 16-year Toronto clinic for cosmetic, laser and dermatology care. Keep scrolling to walk through.</p>
          </div>
          <div ref={frame} className="absolute inset-0 overflow-hidden bg-ndm-slate will-change-transform" style={{ transformOrigin: '50% 50%' }}>
            {SPACE.map((x, i) => (
              <div key={x.v} ref={(el) => (layers.current[i] = el)} className="absolute inset-0 overflow-hidden will-change-transform" style={{ zIndex: i + 1, transform: i ? 'translate3d(-100%,0,0)' : 'none' }}>
                <SpaceClip x={x} vref={(el) => (vids.current[i] = el)} />
              </div>
            ))}
            <div className="absolute inset-0 z-[5] bg-gradient-to-t from-black/45 via-black/0 to-black/25" />
            <div ref={ui} className="absolute inset-0 z-[6]" style={{ opacity: 0 }}>
              <div className="absolute right-[var(--gx)] top-[clamp(104px,14vh,130px)] flex items-center gap-3 rounded-full px-[14px] py-2 font-inter text-[13px] text-white" style={glass}>
                <span className="tabular-nums">0{idx + 1} / 0{SPACE.length}</span>
                <span className="flex gap-1">{SPACE.map((_, i) => <i key={i} className={`h-1 rounded-full bg-white transition-all duration-500 ${i === idx ? 'w-4' : 'w-1 opacity-50'}`} />)}</span>
              </div>
              <div key={idx} className="space-in absolute bottom-[clamp(20px,4vh,40px)] left-[var(--gx)] right-[var(--gx)] rounded-[20px] p-6 text-white md:right-auto md:w-[420px]" style={glass}>
                <p className="font-inter text-[13px] text-white/70">NewDermaMed Toronto</p>
                <p className="mt-2 font-inter text-[22px] font-medium tracking-[-0.02em] md:text-[24px]">{s.t}</p>
                <p className="mt-2 font-inter text-[14px] leading-[1.5] text-white/85">{s.d}</p>
                <div className="mt-4 flex flex-wrap gap-2">{s.chips.map((c) => <span key={c} className="rounded-full border border-white/30 px-3 py-1.5 font-inter text-[12px]">{c}</span>)}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

                    <li key={c.name} className="flex items-start gap-3">
                      <Tile><IconPin /></Tile>
                      <span><span className="block text-white">{c.name}</span>{c.addr}<a href={tel(c.phone)} className="block text-white hover:underline">{c.phone}</a></span>
                    </li>
                  ))}
                  <li className="flex items-center gap-3"><Tile><IconMail /></Tile><a href="mailto:info@newdermamed.com" className="hover:text-white">info@newdermamed.com</a></li>
                </ul>
              </div>
            </div>
            <div className="mt-12 flex flex-col-reverse items-center justify-between gap-5 border-t border-white/15 pt-6 font-inter text-[13px] text-white/65 md:flex-row">
              <p>© 2026 NewDermaMed. Medical treatments by licensed providers.</p>
              <ul className="flex gap-2" role="list">
                {[['Instagram', SOCIAL.instagram, IconInstagram], ['Facebook', SOCIAL.facebook, IconFacebook], ['YouTube', SOCIAL.youtube, IconYouTube], ['X', SOCIAL.x, IconX], ['LinkedIn', SOCIAL.linkedin, IconLinkedIn]].map(([n, h, I]) => (
                  <li key={n}><a href={h} target="_blank" rel="noopener" aria-label={`NewDermaMed on ${n}`} className="grid place-items-center size-9 rounded-[10px] text-white transition-colors hover:bg-white hover:text-ndm-ink" style={{ background: 'rgba(255,255,255,.12)' }}><I /></a></li>
                ))}
              </ul>
              <p className="flex flex-wrap justify-center gap-x-4 gap-y-1">
                <a href="#/privacy-policy" className="hover:text-white">Privacy</a>
                <a href="#/terms" className="hover:text-white">Terms</a>
                <a href="#/refunds" className="hover:text-white">Refunds</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </footer>
  );
}

/* ---------------------------------------------------------------- app */
function App() {
  const heroRef = useRef(null);
  const [introDone, setIntroDone] = useState(REDUCED);
  const [scrolled, setScrolled] = useState(false);
  const [dark, setDark] = useState(true);
  const [search, setSearch] = useState(false);
  const [drawer, setDrawer] = useState(false);

  useOnScroll(() => {
    const y = window.scrollY, vh = window.innerHeight;
    const h = heroRef.current;
    const end = h ? h.offsetTop + h.offsetHeight - vh : vh;
    setScrolled(y > end - 40);
    const probe = 70;
    setDark([...document.querySelectorAll('[data-nav="dark"]')].some((el) => { const r = el.getBoundingClientRect(); return r.top <= probe && r.bottom >= probe; }));
  }, []);

  useEffect(() => {
    const on = search || drawer;
    if (introDone) lockScroll(on);
  }, [search, drawer, introDone]);

  return (
    <>
      <a href="#main" className="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-12 focus:z-[90] focus:rounded-full focus:bg-ndm-amber focus:px-4 focus:py-2 focus:font-mont focus:text-white">Skip to content</a>
      <PromoBar hidden={!introDone} />
      <Header dark={dark} top={introDone ? 36 : 0} visible={introDone} onSearch={() => setSearch(true)} onDrawer={() => setDrawer(true)} />
      <main id="main">
        <Hero sectionRef={heroRef} onIntroDone={() => setIntroDone(true)} />
        <Statement />
        <Partners />
        <Process />
        <Promotions />
        <Routine />
        <Treatments />
        <AptosCare />
        <BeforeAfter />
        <Saying />
        <Team />
        <Space />
        <Social />
        <Journal />
        <VisitUs />
        <Appointment />
        <Faq />
      </main>
      <Footer />
      <SearchOverlay open={search} onClose={() => setSearch(false)} />
      <Drawer open={drawer} onClose={() => setDrawer(false)} />
      <OfferPopup ready={introDone} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
